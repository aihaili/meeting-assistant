<div id="my-screen-short-host" data-v-app=""><div data-v-f3374563="" id="my-screen-short-container" data-my-screen-short-root="true" style="display: block;"><!----><!----><!----><!----><!----><!----></div></div>
<script>

"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── 状态 ────────────────────────────────────────────────────────────
// 服务端是唯一真相来源；本地只保留渲染需要的最小状态：已经画出来的发言、
// 当前筛选、当前选中。发言用 idx 做键，因为滑动窗口 ASR 会反复修正同一句，
// 用数组下标当键会让"修正"变成"追加"。
let S = {
  title: "", started: 0, elapsed: 0,
  participants: [], segments: [], clues: [], types: {},
  agenda: [], prep: [], agendaSource: "",
  since: -1, seqMax: -1,
  filter: new Set(), selected: null, curSpeaker: null,
  spkCounts: {},
  voiceNames: {},
  historyRev: null,
  fullFetch: false,
  spkSig: '',
  rerenderAll: false,
  // 这两个以前没初始化，靠 undefined 当假值在工作（能跑，但下次读代码的人得自己推断）。
  // managed：本次服务是不是启动器拉起来的（决定设置页要不要显示「重启服务」）。
  // notesHidden：便签层是否被用户收起（Alt+P）。
  // guideSeen：使用引导是否已经看过（标记在服务端，见"使用引导"一节）。
  managed: false, notesHidden: false, guideSeen: false,
  segByIdx: new Map(), typesBySeg: new Map(),
  detailFor: null, follow: true,
  // 两块清单各自记展开状态：会议流程通常只在会前看一次，发言计划会中一直要开。
  agendaOpen: false,
  plannedSegIds: new Set(),
  // 当前选中的计划项。拖参考时可以不必精确瞄准——先点选一条，再把参考拖到
  // 计划区任意位置即可落到它上面。
  selPlanId: null,
  // 正在被拖拽的那一张便签。渲染只对它使用 DOM 里的实时位置，其余一律以服务端状态为准，
  // 这样同样状态一定渲染出同样布局——否则宽度会跨轮次继承，最后便签互相压住。
  dragId: null,
  // 服务实际挂载的知识库，由 /api/state 每轮带回来。导入面板要照着它给选项。
  corpora: null,
  // ASR 就绪状态（由 /api/state 的 service.asr 带回）：
  // 录音按钮必须等 ASR 加载完才可用——否则用户在模型加载窗口（~20s）里说话，
  // 这段语音会被丢掉（后端 start 阻塞等模型，但麦克风还没开始采）。
  asrLoaded: false, asrLoading: true, asrSpkError: "",
};

function toast(msg, ms = 2000) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms);
}

// ── 拉取状态 ────────────────────────────────────────────────────────
async function tick() {
  try {
    const r = await fetch("/api/state?since=" + S.since, { cache: "no-store" });
    const d = await r.json();
    apply(d);
    $("#dot").classList.add("live");
  } catch (e) {
    $("#dot").classList.remove("live");
  }
}

function apply(d) {
  S.title = d.title; S.started = d.started; S.elapsed = d.elapsed;
  S.types = d.types || {};
  S.participants = d.participants || [];
  S.clues = d.clues || [];
  S.agenda = d.agenda || [];
  S.prep = d.prep || [];
  S.agendaSource = d.agenda_source || "";
  // 服务实际挂载的知识库（不是 settings.json 里写的）——导入面板要照着它给选项
  if (d.service && d.service.corpora) S.corpora = d.service.corpora;
  // 是不是启动器拉起来的：只有托管时才显示设置页里的「重启服务」按钮
  if (d.service) S.managed = !!d.service.managed;
  // 使用引导看过没有。只在第一帧之后用一次（boot 里的 maybeShowGuide），
  // 但每轮都记下来：关闭引导时会把它设成 true，重启服务后由服务端再次带回。
  if (d.service) S.guideSeen = !!d.service.guide_seen;
  // ASR 就绪状态：录音按钮据此启用/禁用，并在按钮上提示"模型加载中/加载失败"。
  // loaded=模型已就绪；loading=后台还在加载；两者皆否=加载失败（给用户明确报错，
  // 而不是让按钮永远转圈）。spk_error 非空时声纹署名不可用，但不影响转写。
  if (d.service && d.service.asr) {
    S.asrLoaded = !!d.service.asr.loaded;
    S.asrLoading = !!d.service.asr.loading;
    S.asrSpkError = d.service.asr.spk_error || "";
    paintMic();   // ASR 状态变了要立刻刷新按钮（loading→loaded 时启用录音）
  }
  // 历史被改过？（声纹署名、改人名、删发言都会让服务端的 history_rev +1）
  // 增量轮询按 idx 只送新句子，**已经画出来的行永远不会再送**——所以这类改动
  // 在界面上是看不见的，一直到用户按 F5。发现版本号变了就整份重拉一次。
  if (d.history_rev != null) {
    if (S.historyRev != null && d.history_rev !== S.historyRev) {
      S.historyRev = d.history_rev;
      refreshAll();
      return;
    }
    S.historyRev = d.history_rev;
  }
  // 声纹 → 句数：未署名时用来提示点一下会一起改几句
  // spk_counts 变了就要把**已经画出来的行**重画一遍。
  // 增量轮询只送新的 idx，老行不会重新渲染——而"同一声音 2 句"这个提示依赖 spk_counts，
  // 不重画的话它永远不出现（探针抓到过：新灌进去的 4 句一直不显示提示）。
  if (d.service && d.service.spk_counts) {
    const sig = JSON.stringify(d.service.spk_counts);
    if (sig !== S.spkSig) {
      S.spkSig = sig;
      S.spkCounts = d.service.spk_counts;
      S.rerenderAll = true;
    }
  }
  if (d.service && d.service.voice_names) {
    S.voiceNames = d.service.voice_names;
  }
  S.plannedSegIds = new Set(S.prep.map(p => p.seg_id).filter(Boolean));

  // 只看新来的发言；已经渲染过的 idx 用 update 而不是 insert
  let added = false;
  for (const s of (d.segments || [])) {
    if (S.segByIdx.has(s.idx)) {
      Object.assign(S.segByIdx.get(s.idx), s);
      renderSeg(s.idx);
    } else {
      S.segByIdx.set(s.idx, s);
      insertSeg(s);
      added = true;
    }
    S.seqMax = Math.max(S.seqMax, s.idx);
  }
  if (S.since < 0) S.since = 0;
  else if (S.seqMax >= 0) S.since = S.seqMax + 1;

  if (added) {
    // 首屏不自动滚到底部会让人以为坏了；之后只在用户本来就在底部时跟随，
    // 否则会把他正在读的内容顶走。
    if (S.follow) scrollFeed();
    $("#feed").querySelector(".empty")?.remove();
  }

  // 全量拉取的那一次，把界面上已经没有对应发言的行剪掉。
  // 增量协议只能"新增/更新"，看不见**删除**——不剪的话删掉的句子会永远留在发言流里，
  // 而且新句子拿到同一个 idx 时，界面上会出现两行同 idx 的发言。
  if (S.fullFetch) {
    S.fullFetch = false;
    for (const n of [...$("#feed").querySelectorAll(".utt")]) {
      if (!S.segByIdx.has(+n.dataset.idx)) n.remove();
    }
  }
  // 需要的话把这一屏的发言全部重画（见上面 spk_counts 的处理）
  if (S.rerenderAll) {
    S.rerenderAll = false;
    for (const idx of S.segByIdx.keys()) renderSeg(idx);
  }
  indexCluesBySeg();
  renderPeople();
  renderPlans();
  renderClues();
  renderHeader(d);

  if (!S.selected && d.segments && d.segments.length) {
    selectSeg(d.segments[d.segments.length - 1].idx, false);
  }
}

function scrollFeed() {
  const f = $("#feed");
  requestAnimationFrame(() => { f.scrollTop = f.scrollHeight; });
}

function indexCluesBySeg() {
  S.typesBySeg = new Map();
  for (const c of S.clues) {
    if (!S.typesBySeg.has(c.seg_id)) S.typesBySeg.set(c.seg_id, []);
    S.typesBySeg.get(c.seg_id).push(c);
  }
}

function renderHeader(d) {
  $("#title").value = S.title;
  const e = Math.max(0, Math.round(S.elapsed));
  $("#elapsed").textContent =
    Math.floor(e / 60) + ":" + String(e % 60).padStart(2, "0");
  $("#nseg").textContent = S.segByIdx.size;
  $("#nclue").textContent = S.clues.length;
  $("#pcount").textContent = S.participants.length;
  $("#mcount").textContent = S.segByIdx.size;
  $("#ccount").textContent = S.clues.length;

  const a = d.service && d.service.audio;
  const asr = d.service && d.service.asr;
  const st = $("#audio-stat");
  if (a) {
    const lvl = a.peak_dbfs;
    const tone = lvl == null ? "" : (lvl > -45 ? "var(--com)" : "var(--text-3)");
    st.innerHTML = `<span class="k">电平</span><b style="color:${tone}">` +
      (lvl == null ? "—" : lvl.toFixed(1) + " dB") + "</b>";
    st.title = `${a.source} · ${a.sample_rate} Hz · ${a.channels}ch · ` +
      `已收 ${a.seconds_received}s`;
  } else {
    st.innerHTML = `<span class="k">音频</span><b>未连接</b>`;
    st.title = "麦克风未采集；可用「试听回放」注入一段 WAV";
  }
  if (d.dropped && d.dropped.length) {
    st.innerHTML += ` <span class="k" title="${esc(d.dropped.join(' / '))}">⚠</span>`;
  }
}

// ── 左栏 ────────────────────────────────────────────────────────────
function renderPeople() {
  const box = $("#people");
  if (!S.participants.length) {
    box.innerHTML = '<div class="empty" style="padding:18px 8px">还没有参会人员<br>' +
      '在下面输入名字添加</div>';
    return;
  }
  box.textContent = "";
  for (const p of S.participants) {
    const row = el("div", "person" + (p.speaking ? " speaking" : "") +
      (S.curSpeaker === p.id ? " active" : ""));
    row.title = `${p.name}${p.org ? " · " + p.org : ""}${p.role ? " · " + p.role : ""}` +
      "\n点击：把接下来的发言绑给他";
    const av = el("div", "avatar", p.name.slice(-2));
    av.style.background = p.color || "#64748b";
    av.style.color = p.color || "#64748b";
    av.style.setProperty("color", p.color || "#64748b");
    const meta = el("div", "p-meta");
    meta.appendChild(el("div", "p-name", p.name));
    const sub = el("div", "p-sub");
    sub.appendChild(el("span", null, [p.org, p.role].filter(Boolean).join(" · ") || "—"));
    // 声纹胶囊：绑好了就说清这一段声音覆盖几句。
    // "已绑定声纹"太笼统——用户想知道的是"我绑的那一下管了多少句"。
    const nSpk = p.voice_id && S.spkCounts ? (S.spkCounts[p.voice_id] || 0) : 0;
    const chip = el("span", "voice-chip" + (p.voice_id ? " on" : ""),
      p.voice_id ? (nSpk > 1 ? `${nSpk} 句同一声音` : "已绑定声纹") : "未绑定");
    chip.title = p.voice_note || (p.voice_id ? "这段声音已经绑给这个人" : "还没绑定");
    if (p.voice_id) {
      // 点胶囊可以解绑：绑错了要能退回来，否则只能删人重加。
      chip.style.cursor = "pointer";
      chip.onclick = async ev => {
        ev.stopPropagation();
        await fetch("/api/participants", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "unbind_voice", id: p.id }) });
        toast(`已解除 ${p.name} 的声纹绑定`, 3000);
        refreshAll();
      };
    }
    sub.appendChild(chip);
    meta.appendChild(sub);
    const rm = el("button", "rm", "×");
    rm.title = "移除此人";
    rm.onclick = async ev => {
      ev.stopPropagation();
      await fetch("/api/participants", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "remove", id: p.id }) });
      tick();
    };
    row.append(av, meta, rm);
    row.onclick = () => {
      S.curSpeaker = (S.curSpeaker === p.id) ? null : p.id;
      renderPeople();
      if (S.selected != null) bindSpeaker(S.selected);
    };
    box.appendChild(row);
  }
}

/** Pull the whole state again, not just what is new.
 *
 * 声纹署名改的是**已经画出来**的那些发言，而增量轮询的 since 是"最后一句的 idx"，
 * 永远不会再把它们送回来。不强制全量拉一次的话：服务端已经改名了，界面上还是"未署名"，
 * 一直到用户按 F5。实测就是这样——探针从界面读到的名字全是"未署名"，而服务端的名字是对的。
 * 绑声纹、解绑、改人名这些"改历史"的动作，都必须走这里。
 */
/** 确认声纹库的建议：和手动绑定走同一条路（服务端会顺带再登记一条向量）。 */
async function confirmSuggestion(segId, personId) {
  const d = await (await fetch("/api/participants", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "bind_voice", id: personId, seg_id: segId }) })).json();
  if (d.error) { toast(d.error, 3600); return; }
  toast(d.changed > 1
    ? `已确认：同一段声音的 ${d.changed} 句都记为 ${(d.participant || {}).name}`
    : `已确认：${(d.participant || {}).name}`, 3600);
  refreshAll();
}

/** 不是他：记下来，这个声纹别再问。否定和肯定一样是信息。 */
async function denySuggestion(segId) {
  await fetch("/api/participants", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "deny_suggestion", seg_id: segId }) });
  toast("已记下：这个声音不是他", 2600);
  refreshAll();
}

/** 给匿名声纹起名字：所有同 spk 的段一起改名。 */
async function renameSpeaker(spk) {
  const name = prompt("给这个声音起个名字：", "");
  if (!name || !name.trim()) return;
  const d = await (await fetch("/api/participants", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "rename_speaker", spk, name: name.trim() }) })).json();
  if (d.error) { toast(d.error, 3600); return; }
  toast(`已把 ${d.renamed} 句记为「${name.trim()}」`, 3200);
  refreshAll();
}

/** 把某段发言改归属到另一个说话人。 */
async function reassignSeg(segId, curSpk) {
  // 列出所有已知的 spk（从 segments 里收集）
  const spks = new Set();
  for (const [idx, s] of S.segByIdx) {
    if (s.spk && s.spk !== curSpk) spks.add(s.spk);
  }
  if (spks.size === 0) { toast("没有其它说话人可选", 2600); return; }
  const opts = [...spks].map(sp => {
    const cnt = S.spkCounts ? (S.spkCounts[sp] || 0) : 0;
    const label = S.voiceNames && S.voiceNames[sp]
      ? S.voiceNames[sp] + "（" + cnt + " 句）"
      : "匿名（" + cnt + " 句）";
    return label + "  [" + sp + "]";
  });
  const choice = prompt("选择目标说话人（输入编号）：\n" +
    opts.map((o, i) => (i + 1) + ". " + o).join("\n") + "\n\n输入 0 = 清除署名", "1");
  if (choice === null) return;
  const n = parseInt(choice, 10);
  if (n === 0) {
    // 清除署名
    const d = await (await fetch("/api/segment", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "reassign", id: segId, target_spk: "" }) })).json();
    if (d.error) { toast(d.error, 3600); return; }
    toast("已清除署名", 2600);
    refreshAll();
    return;
  }
  if (n < 1 || n > opts.length) { toast("无效选择", 2600); return; }
  const targetSpk = [...spks][n - 1];
  const d = await (await fetch("/api/segment", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "reassign", id: segId, target_spk: targetSpk }) })).json();
  if (d.error) { toast(d.error, 3600); return; }
  toast("已改归属", 2600);
  refreshAll();
}

// ── 录音按钮（本机麦克风）────────────────────────────────────────────
// 用户的原话：「没有一个我可以让你知道什么时候停止录音的按钮之类的」。
// 在这之前，录音由服务端启动、也没人说得清什么时候停，于是讲完了还在录静音——
// 测试流程本身是坏的。现在开始/停止都在这个按钮上，停止时服务端把这一段的 PCM
// 收成 WAV 并把时长、电平、峰值报回来。
let micT0 = 0, micTimer = null, micOk = false;

function paintMic() {
  const on = micTimer !== null;
  $("#mic-dot").style.display = on ? "" : "none";
  if (!micOk) {
    $("#mic-label").textContent = "录音";
    $("#btn-mic").disabled = true;
    $("#btn-mic").title = "这次启动没有麦克风输入（要用 --mic 启动）";
    return;
  }
  // ASR 未就绪：禁用录音按钮并提示原因。
  // 首次启动模型加载要 ~20s，这期间说话会被丢掉（后端 start 阻塞等模型，
  // 麦克风还没开始采）。加载失败则明确报错，不让按钮永远转圈骗人。
  if (!S.asrLoaded) {
    $("#btn-mic").disabled = true;
    if (S.asrLoading) {
      $("#mic-label").textContent = "ASR 加载中…";
      $("#btn-mic").title = "语音模型加载中（首次启动约 20 秒），完成后即可录音";
    } else {
      $("#mic-label").textContent = "ASR 未就绪";
      $("#btn-mic").title = "语音模型加载失败，请重启服务后重试";
    }
    return;
  }
  $("#btn-mic").disabled = false;
  $("#mic-label").textContent = on
    ? "停止 " + fmtT((Date.now() - micT0) / 1000) : "录音";
  $("#btn-mic").title = on ? "点一下停止，并把这一段存成文件" : "开始录音";
}

async function micAction(action) {
  const d = await (await fetch("/api/mic", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action }) })).json();
  if (d.error) { toast(d.error, 3600); return d; }
  if (action === "start") {
    toast("开始录音。讲完点这个按钮停止。", 3000);
  } else {
    const tk = d.take || {};
    toast(tk.wav
      ? `已停止并保存 ${tk.wav.split(/[\\/]/).pop()} · ${tk.seconds}s · `
        + `峰值 ${tk.peak}${tk.peak >= 0.99 ? "（削顶了，麦克风太冲）" : ""}`
      : "已停止（这一段没有音频）", 5200);
  }
  paintMic();
  return d;
}

$("#btn-mic").onclick = async () => {
  // **按下就翻转状态，不等服务器回话。**
  // 之前是"等 POST 返回才改按钮"，而服务器要在那次请求里加载模型（20+ 秒），
  // 于是第一下看起来毫无反应，用户以为没按到、再按一次——这就是"要按两次"的原因。
  const starting = micTimer === null;
  if (starting) { micT0 = Date.now(); micTimer = setInterval(paintMic, 500); }
  else { clearInterval(micTimer); micTimer = null; }
  paintMic();
  const d = await micAction(starting ? "start" : "stop");
  if (d && d.error) {                      // 失败了回滚，别让按钮骗人
    if (starting) { clearInterval(micTimer); micTimer = null; }
    else { micT0 = Date.now(); micTimer = setInterval(paintMic, 500); }
    paintMic();
  }
};
fetch("/api/mic").then(r => r.json()).then(d => {
  micOk = !!d.available;
  if (d.running) { micT0 = Date.now() - (d.seconds || 0) * 1000;
    micTimer = setInterval(paintMic, 500); }
  paintMic();
}).catch(() => { micOk = false; paintMic(); });

async function refreshAll() {
  S.since = -1;
  S.seqMax = -1;
  S.fullFetch = true;   // 全量拉：顺便把**已被删掉**的行从界面上清掉
  await tick();
}

function bindSpeaker(idx) {
  if (!S.curSpeaker) return;
  const p = S.participants.find(x => x.id === S.curSpeaker);
  if (!p) return;
  const s = S.segByIdx.get(idx);
  if (!s) return;
  // 交给服务端去做"同一声纹一起署名"——**不要在这里只改本地这一句**。
  //
  // 这一句以前是 `s.speaker = p.name`，只动当前这一段，然后在参会人上写一个假的
  // voice_id（"voice-" + id）。于是用户点了之后，同一段声音的其它句子还是"未署名"，
  // 而左栏看起来已经绑好了——状态是假的，和界面对不上。
  // 现在服务端返回改了几段，界面照实说出来。
  fetch("/api/participants", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "bind_voice", id: p.id, seg_id: s.id }) })
    .then(r => r.json())
    .then(d => {
      if (d.error) { toast(d.error, 3600); return; }
      if (d.spk && d.bound_segments > 1) {
        toast(`已把同一段声音的 ${d.bound_segments} 句都记为 ${p.name}`, 3600);
      } else if (d.spk) {
        toast(`已记为 ${p.name}（这段声音目前只有 1 句）`, 3200);
      } else {
        toast(`已把这段记为 ${p.name}；这段没有声纹信息，不会自动推广到别的句子`, 4200);
      }
      refreshAll();
    })
    .catch(e => toast("署名失败：" + e, 4000));
}

// ── 中栏：发言流 ────────────────────────────────────────────────────
// ── 推送（SSE）：服务端一改就送，没有轮询间隔 ─────────────────────────
// 为什么换掉轮询：轮询是"拉"，天生有间隔；更糟的是增量的 since=最大idx+1
// **只送新行、永远不重送被更新的行**，而流式识别恰恰是原地把一行越改越长——
// 于是界面上每行只显示第一个版本，看起来就是"跟不上语音"。
// 推送没有这个问题：改一次推一次，推的就是那一行的当前内容。
function applyStreamSeg(seg) {
  const known = S.segByIdx.has(seg.idx);
  if (known) {
    Object.assign(S.segByIdx.get(seg.idx), seg);   // 原地更新：正在长的那一行
  } else {
    S.segByIdx.set(seg.idx, seg);
    insertSeg(S.segByIdx.get(seg.idx));
  }
  S.seqMax = Math.max(S.seqMax, seg.idx);
  renderSeg(seg.idx);
  if (!known) {
    sortFeed();
    follow();
    const n = $("#nseg");
    if (n) n.textContent = S.segByIdx.size;
  }
}

function startStream() {
  if (!window.EventSource) return;                 // 老浏览器：退回轮询
  const es = new EventSource("/api/stream");
  es.onmessage = ev => {
    try {
      const d = JSON.parse(ev.data);
      if (d.type === "seg" && d.seg) {
        if (d.history_rev != null) S.historyRev = d.history_rev;  // 别让轮询又整份重拉
        applyStreamSeg(d.seg);
      }
    } catch (e) { /* 一条坏消息不该拖垮页面 */ }
  };
  es.onerror = () => {};      // EventSource 自己会重连
  window.__dshStream = es;
}

function insertSeg(s) {
  const feed = $("#feed");
  const node = el("div", "utt" + (s.revised ? " open" : ""));
  node.dataset.idx = s.idx;
  node.innerHTML = `
    <div class="u-time"><span class="u-grip" title="拖到便签上钉住；拖到空白处则新建一张便签">⠿</span>${fmtT(s.start)}</div>
    <div class="u-body">
      <div class="u-who"></div>
      <div class="u-text"></div>
    </div>
    <div class="rev" title="这句还可能被后续音频修正"></div>`;
  node.onclick = () => selectSeg(s.idx, true);
  feed.appendChild(node);
  renderSeg(s.idx);
  // 插到正确的时间位置：ASR 修正过的句子会带着更早的 start 回来，
  // 简单 append 会让时间轴倒着长。
  if (feed.children.length > 1) sortFeed();
}

function sortFeed() {
  const feed = $("#feed");
  const nodes = [...feed.querySelectorAll(".utt")];
  nodes.sort((a, b) => {
    const A = S.segByIdx.get(+a.dataset.idx) || {}, B = S.segByIdx.get(+b.dataset.idx) || {};
    return (A.start || 0) - (B.start || 0) || (+a.dataset.idx) - (+b.dataset.idx);
  });
  for (const n of nodes) feed.appendChild(n);
}

function renderSeg(idx) {
  const s = S.segByIdx.get(idx);
  const node = $(`#feed .utt[data-idx="${idx}"]`);
  if (!s || !node) return;
  const who = node.querySelector(".u-who");
  const spk = s.spk || "";
  const nSpk = spk && S.spkCounts ? (S.spkCounts[spk] || 0) : 0;
  if (s.speaker) {
    const p = S.participants.find(x => x.name === s.speaker);
    who.textContent = s.speaker;
    who.style.color = (p && p.color) || "var(--text-2)";
    // 同一个人的发言用同一个颜色：左侧色条改成他的颜色。
    node.classList.add("has-spk");
    node.style.setProperty("--utt-bar", (p && p.color) || "var(--term)");
    who.onclick = ev => { ev.stopPropagation(); S.curSpeaker = p ? p.id : null;
      renderPeople(); };
  } else {
    // 未署名时把"同一段声音还有几句"说出来：用户点一下，这些会一起改名。
    // 不说的话他不知道这一下会影响别的句子，也不知道为什么改完之后别处也变了。
    who.textContent = "";
    who.appendChild(document.createTextNode(
      S.curSpeaker
        ? "点击归到 " + ((S.participants.find(x => x.id === S.curSpeaker) || {}).name || "?")
        : "未署名"));
    who.style.color = "var(--text-3)";
    node.classList.remove("has-spk");
    node.style.removeProperty("--utt-bar");
    if (spk && nSpk > 1) {
      who.appendChild(el("span", "u-spk",
        "同一声音 " + nSpk + " 句 · 点一次一起署名"));
    }
    // 声纹库认出来了：给建议，让人点一下。名字来自跨会声纹库，可靠度用百分比写出来。
    const sug = s.suggest;
    if (sug && sug.name) {
      const box = el("span", "u-sug");
      box.appendChild(el("span", null,
        (sug.ok ? "听起来像 " : "有点像 ") + sug.name + " " +
        Math.round((sug.score || 0) * 100) + "%"));
      const yes = el("button", null, "是他");
      yes.title = "绑定：把这一声纹的所有发言都记为 " + sug.name;
      yes.onclick = ev => { ev.stopPropagation(); confirmSuggestion(s.id, sug.person_id); };
      const no = el("button", "no", "不是他");
      no.title = "记下来，这一声纹别再问了";
      no.onclick = ev => { ev.stopPropagation(); denySuggestion(s.id); };
      box.appendChild(yes); box.appendChild(no);
      who.appendChild(box);
    }
    // 手动修正：改名 + 改归属
    if (spk) {
      const fixBox = el("span", "u-sug");
      const btnR = el("button", null, "改名");
      btnR.title = "给这个声音起个名字（所有同声音的段一起改）";
      btnR.onclick = ev => { ev.stopPropagation(); renameSpeaker(spk); };
      const btnA = el("button", null, "改归属");
      btnA.title = "把这段发言移到另一个说话人";
      btnA.onclick = ev => { ev.stopPropagation(); reassignSeg(s.id, spk); };
      fixBox.appendChild(btnR); fixBox.appendChild(btnA);
      who.appendChild(fixBox);
    }
  }
  node.querySelector(".u-text").innerHTML = highlight(s);
  node.classList.toggle("open", !!s.revised);
  node.classList.toggle("sel", S.selected === idx);

  // 用颜色而不是文字标签表达类型。用户的要求是"同类的就同一种颜色就行了"——
  // 一排文字徽章（甲方要求/时间节点/我方承诺…）在每条发言下面重复出现，
  // 既占地方又要逐个读，而颜色是零成本的并行通道。类型名移到 title 里，
  // 需要确认时把鼠标停一下即可，右栏的线索卡都带完整文字标签。
  const cs = S.typesBySeg.get(s.id) || [];
  let tone = "";
  for (const k of Object.keys(S.types)) {          // 按 CLUE_TYPES 顺序取最高优先级
    const hit = cs.find(c => c.kind === k);
    if (hit) { tone = hit.meta.tone; break; }
  }
  node.dataset.tone = tone;
  node.title = cs.length
    ? cs.map(c => c.meta.label + "：" + c.anchor).join("\n")
    : "";
}

function fmtT(t) {
  t = Math.max(0, t || 0);
  return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
}

// 关键词高亮：长词优先，且不跨越已生成的标签——用占位符做两阶段替换，
// 直接在 HTML 上循环替换会让后一个词切进前一个词的标签里。
function highlight(s) {
  let raw = String(s.text || "");
  const kws = (s.keywords || []).filter(k => k && raw.includes(k))
    .sort((a, b) => b.length - a.length);
  if (!kws.length) return esc(raw);
  const marks = [];
  for (const k of kws) {
    raw = raw.split(k).join("\u0000" + marks.length + "\u0000");
    marks.push(k);
  }
  let html = esc(raw);
  marks.forEach((k, i) => {
    html = html.replace("\u0000" + i + "\u0000",
      `<span class="kw" data-term="${esc(k)}">${esc(k)}</span>`);
  });
  return html;
}

function selectSeg(idx, scroll) {
  if (S.selected != null) {
    const old = $(`#feed .utt[data-idx="${S.selected}"]`);
    old && old.classList.remove("sel");
  }
  S.selected = idx;
  const node = $(`#feed .utt[data-idx="${idx}"]`);
  if (node) {
    node.classList.add("sel");
    if (scroll) node.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  // 右栏跟着当前发言走：这是"同时有发言和参会人员才能关联声纹"那条要求的落点,
  // 选中一段发言时右边立刻只显示这一段产生的线索。
  if (S.curSpeaker) bindSpeaker(idx);
  renderClues();
}

// ── 会议流程（面板）与发言计划（便签）────────────────────────────────
// 两块清单的数据来源同一个 API，但呈现方式刻意不同：
//   会议流程 —— 主持人的安排，从文件来，是"背景"，用可折叠面板（会前看一次）；
//   发言计划 —— 用户自己的要点，是"工作面"，用便签（会中一直要看全貌）。
//
// 标签用颜色区分，而且**只有颜色**：用户明确说过"不用把同类型的放到同一个标签，
// 要区分用不同颜色就行了"。便签上因此只有一个 10px 的小字名，扫一眼靠颜色。
// 编辑器里相反——要选，就得看见名字，所以编辑器用"色点 + 名字"的药丸按钮。
//
// 这套 kind 与 scripts/meeting/planfile.py 的 PLAN_KINDS 必须一致：文件里的 kind
// 决定便签颜色，两边对不上就会出现"文件说是风险、界面上是议题"。改一边要改另一边。
const PL_KINDS = {
  topic: "议题", confirm: "待确认", report: "要汇报", risk: "风险",
  followup: "上次遗留",
};
// kind -> CSS 令牌。不写死颜色值：暗色主题下令牌会换成另一组，
// 写死就等于"暗色主题下标签还是亮色的那套颜色"，而那种错很难被看出来。
const PL_TOKENS = {
  topic: "--dec", confirm: "--req", report: "--com", risk: "--risk",
  followup: "--agr",
};

function renderPlans() {
  renderPlanList({ list: "#pa-list", count: "#pa-count",
                   items: S.agenda, which: "agenda" });
  renderNotes();
  $("#pa-src").textContent = S.agendaSource
    ? "来自 " + S.agendaSource.split(/[\\/]/).pop() : "";
  $("#pa-src").title = S.agendaSource || "还没有导入会议流程";
}

// ── 便签 ────────────────────────────────────────────────────────────

const NOTE_W = 232;
const NOTE_GAP = 12;

/** Where notes are **placed automatically**: a lane on the right of the 发言流 column.
 *
 * 三个版本才走到这里，而且第四版是被用户骂出来的。
 *
 * 第一版便签层整页铺开。实测截图里它压在右栏的线索上——线索是"我讲这个时有依据"那一半，
 * 盖住它等于把助手的一半功能挡掉。而且坐标是视口绝对值，窗口一改大小就跑到别的栏上。
 *
 * 第二版把便签夹进中栏，不再压侧栏——但整片压住了发言流：发言正文横跨整列，便签摆哪都盖字。
 * 而"忠实记录"是这产品的核心，为了看自己的便签把别人说的话盖掉，这个交换是亏的。
 *
 * 第三版给便签留一条专道，发言流只画左边那一半。**但这一版把"自动摆放的位置"和
 * "允许挪动的范围"当成了同一个东西**，于是给整便签道加了一道硬夹紧。用户的反馈是
 * "还是非常不跟手，而且可移动的范围被限制了"——在便签道边上往左或往上拖，可用空间是 0，
 * 便签纹丝不动。**夹紧太紧，表现上就是"不跟手"**，两句话说的是同一件事。
 *
 * 所以第四版把两件事拆开：
 *   · `noteArea()`  —— 自动摆放落在哪（便签道，界面一打开就整齐）；
 *   · `moveArea()`  —— 允许挪到哪（整个工作区，只保证不飞出屏幕）。
 * 默认整齐，但用户想摆哪就摆哪——那本来就是便签的意义。
 */
const NOTE_LANE_MAX = 2 * 232 + 12;      // 最多两列便签

/** Where a note may be **dragged**: the whole workspace, minus the header.
 *
 * 只保留"不能被推出屏幕"这一条：留 4px 边距，保证任何一张都还能被抓回来。
 * 便签盖住什么由用户决定——盖住发言流是他的选择，而被一道看不见的墙挡住不是。
 */
function moveArea() {
  const head = document.querySelector("header");
  const top = Math.round((head ? head.getBoundingClientRect().bottom : 0) + 4);
  return { left: 4, top: top, right: Math.max(120, innerWidth - 4),
           bottom: Math.max(top + 80, innerHeight - 4) };
}

function noteArea() {
  const mid = $("#col-mid");
  const feed = $("#feed");
  if (!mid) {
    return { left: 0, right: innerWidth, top: 0, bottom: innerHeight, laneW: NOTE_W };
  }
  const r = mid.getBoundingClientRect();
  const fr = feed ? feed.getBoundingClientRect() : r;
  // 中栏越宽便签道越宽，但不低于一列、不超过两列——窄窗口下要优先保住发言流。
  const laneW = Math.max(NOTE_W,
    Math.min(NOTE_LANE_MAX, Math.round(r.width * 0.52)));
  // left 由 right - laneW 推出来，不能写成 r.right - laneW + 8：
  // 那样可用跨度会少 16px，正好装不下"两列 232 + 12 间距 = 476"，
  // 于是列数算成 1，两张便签被摆到相差 228px 的位置上——肉眼看不出来，但会重叠 4px。
  const right = Math.round(r.right - 8);
  return {
    left: right - laneW,
    right: right,
    top: Math.round(Math.max(fr.top, r.top) + 8),
    bottom: Math.round(r.bottom - 8),
    laneW: laneW,
  };
}

/** Reserve the lane for notes, or hand the full width back to the transcript. */
/** Reserve the lane for notes, or hand the full width back to the transcript.
 *
 * 只有在**还有便签是自动摆放的**时候才让位。用户把便签都拖到别处之后，发言流就该拿回
 * 整栏宽度——否则中栏会永远窄掉一半，为了一个已经不存在的东西付代价。
 */
function applyNoteLane() {
  const feed = $("#feed");
  if (!feed) return;
  const autoPlaced = (S.prep || []).some(a => a.nx == null);
  if (S.notesHidden || !autoPlaced) {
    feed.style.marginRight = "";
    return;
  }
  // 便签道含右侧留白，发言流让出同样的宽度，于是两边永远不重叠。
  feed.style.marginRight = (noteArea().laneW + 8) + "px";
}

function clampNote(b, x, y, w, h) {
  const maxX = Math.max(b.left, b.right - w);
  const maxY = Math.max(b.top, b.bottom - Math.max(h, 60));
  return { x: Math.min(maxX, Math.max(b.left, x)),
           y: Math.min(maxY, Math.max(b.top, y)) };
}

/** What the notes layer renders from. Two jobs, both learned the hard way:
 *
 *  1. **拖拽期间不许重建。** 重建会换掉元素，而拖拽的处理函数抓着旧元素——写进去的位置
 *     没人看得见，用户看到的是"每秒弹回起点一次"。这就是"便签移动非常困难"的根因。
 *  2. **轮询不该重建没变的东西。** 每个 poll（约 1 秒）都重建整层，会把正在改字的便签
 *     打断（contentEditable 元素被换掉，焦点就没了），也让拖拽更容易被撞上。
 *
 * 所以：拖拽中直接返回；签名没变直接返回。几何也算进签名——窗口改大小之后签名变了，
 * 便签才会按新的便签道重排。
 */
function notesSignature(items, b) {
  const geo = [b.left, b.right, b.top, b.bottom].join(",");
  const body = (items || []).map(a => [
    a.id, a.kind, a.done ? 1 : 0, a.topic, a.detail || "", a.seg_id || "",
    (a.refs || []).length, a.nx, a.ny, a.nw, a.nz,
  ].join("|")).join("\n");
  return geo + "#" + items.length + "#" + body;
}

let notesSig = "";

function renderNotes() {
  const layer = $("#notes-layer");
  const items = S.prep || [];
  $("#pp-count").textContent = items.length;
  // 便签道先定下来，发言流再让出对应宽度——顺序反了会量到上一次的布局。
  applyNoteLane();

  // 正在拖：这一层保持原样。任何重建都会把手指底下的元素换掉。
  if (S.dragId) return;

  const sig = notesSignature(items, noteArea());
  if (sig === notesSig && layer.childElementCount) {
    // 内容没变：只同步"选中"这一个 class，不重建 DOM。
    // 重建会把正在编辑的便签打断——点一下正文准备改字，一秒后焦点就没了。
    for (const n of layer.querySelectorAll(".note")) {
      n.classList.toggle("active", n.dataset.id === S.selPlanId);
    }
    return;
  }
  notesSig = sig;

  // 只在**正在拖的那一张**上使用 DOM 里的实时位置。轮询会重建 DOM，不记的话
  // 用户拖到一半的便签会跳回旧位置。
  //
  // 这个缓存只对拖拽中的那张成立。之前它对所有便签生效，于是渲染不再幂等：某次渲染
  // 量到的宽度会被下一次当成"用户设的宽度"继承下去，而同一轮的其它便签用的是新列宽，
  // 两者越差越多，最后互相压住（实测 1280x800 下 232 与 172 两套宽度混在一起）。
  const live = {};
  if (S.dragId) {
    const n = layer.querySelector('.note[data-id="' + S.dragId + '"]');
    if (n) {
      live[S.dragId] = { nx: parseFloat(n.style.left), ny: parseFloat(n.style.top),
                         nw: parseFloat(n.style.width),
                         nh: n.style.height ? parseFloat(n.style.height) : 0 };
    }
  }
  layer.textContent = "";

  // 空的时候**什么都不画**。原来这里是一块四行加粗的引导文字，摆在发言流右侧
  // 正中间——用户说"非常碍眼"，而且它是**重复的**：底部那条栏已经有输入框
  // （placeholder 写着"写一条要点，回车即成便签…"）和「＋ 新便签」按钮。
  // 引导文字该在用户需要它的那一刻出现，而不是长期占着版面。
  if (!items.length) return;

  const b = noteArea();
  // 列数取两者的大者：
  //   · 横向放得下几列（便签道宽度决定），这是首选；
  //   · 竖向至少要几列才装得下（窗口矮时要多开一列，否则最后一张会和上一张叠住）。
  // 只用高度算会导致同一个窗口因为"会议流程"折叠与否而换列数——同一份状态出两种布局，
  // 那种不稳定最容易被当成 bug。
  const laneW = b.right - b.left;
  const byWidth = Math.max(1,
    Math.floor((laneW + NOTE_GAP) / (NOTE_W + NOTE_GAP)));
  const EST_H = 196;
  const avail = Math.max(120, b.bottom - b.top);
  const perCol = Math.max(1, Math.floor(avail / EST_H));
  const needCols = Math.max(1, Math.ceil(items.length / perCol));

  // 摆放可以**重来**：一列放不下就多开一列。
  //
  // 估算永远不准——没有参考条的便签高 63px，挂两条参考的高 232px，差三倍多。
  // 估算少了就会出现"这一列塞不下，只能要么叠住、要么跑出屏幕"。这两种都不可接受
  // （叠住看不清，出屏抓不回来），所以宁可把宽度收窄一点、多开一列。
  // `attempts` 记录实际用了几列，写进 audit 的指标里，便于以后回看。
  let cols = Math.max(1, Math.min(3, Math.max(byWidth, needCols)));
  let placed = [];
  let overflowed = false;
  let assigned = [];
  for (let attempt = 0; attempt < 2; attempt++) {
    const res = placePass(cols);
    placed = res.placed;
    overflowed = res.overflowed;
    assigned = res.assigned;
    if (!overflowed || cols >= 3) break;
    cols += 1;                      // 放不下：多一列，重来
  }

  // 首次摆放落盘（就一次，不是每次渲染）。这样"自动摆放"只发生一次，
  // 之后每张便签都有自己的坐标，别人怎么拖都不会让它们挪位。
  if (assigned.length) {
    fetch("/api/prep/layout", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: assigned }),
    }).catch(() => { /* 落盘失败不影响本次显示，下次渲染会再试 */ });
  }

  /** One full placement pass at a given column count. Returns the placed rects. */
  function placePass(cols) {
  const autoW = Math.max(150, Math.min(NOTE_W,
    Math.floor((laneW - (cols - 1) * NOTE_GAP) / cols)));
  const colX = i => b.left + i * (autoW + NOTE_GAP);
  // 每列一个"下一个空位的 y"。高度只有插进 DOM 之后才知道，所以边插边量，
  // 用真实高度推进游标——固定行距是错的：带参考条的便签高 179，行距写 172 就叠 7px。
  const cursor = [];
  for (let i = 0; i < cols; i++) cursor.push(b.top);
  const placed = [];
  // 这一遍里被**自动**摆了位置的便签（见下面 assigned.push）
  const assigned = [];
  let overflow = false;
  const ovl = (a, b2) =>
    Math.min(a.right, b2.right) - Math.max(a.left, b2.left) > 4 &&
    Math.min(a.bottom, b2.bottom) - Math.max(a.top, b2.top) > 4;
  const hitsRect = (x, y, w, h) =>
    placed.find(p => ovl(p.rect, { left: x, top: y, right: x + w, bottom: y + h }));
  const colOf = x => Math.max(0, Math.min(cols - 1,
    Math.round((x - b.left) / (autoW + NOTE_GAP))));
  layer.textContent = "";

  for (const a of items) {
    const pos = live[a.id] || null;
    const wantX = pos ? pos.nx : (a.nx != null ? a.nx : null);
    const wantY = pos ? pos.ny : (a.ny != null ? a.ny : null);
    // 宽度：用户显式缩过（nw>0）就听他的，否则用当前列宽。
    // 但**必须再夹一次**：自动摆放的不能宽过一列，否则它会越出便签道压到线索栏上
    // （实测：遗留的 nw=232 在只需要 172 宽的两列布局里，右边多出 60px 直接压住侧栏）。
    // 绝不继承上一次渲染量到的宽度——那会让渲染结果依赖历史，而不是依赖状态。
    const wRaw = (pos && pos.nw) || (a.nw > 0 ? a.nw : autoW);
    let w = Math.min(wRaw, wantX != null ? laneW : autoW);
    const h = (pos && pos.nh) || a.h || a.nh || 0;

    // 先插进去量真实高度：便签高度取决于文字折行和参考条数量，估不准。
    const note = buildNote(a, b.left, b.top, w, h, a.nz || 0);
    layer.appendChild(note);
    let measured = note.getBoundingClientRect().height;

    let keep = false;
    if (wantX != null && wantY != null) {
      // 用户摆过的位置**一律原地保留**，不做避让判定。
      //
      // 这里原来是"只要不和别人叠在一起就保留"，叠了就回落到自动摆放。后果是级联的：
      // 你把一张便签拖到别人身上 → 它被判成"撞了" → 重新自动摆放 → 那一列的游标变了
      // → 排在它后面的自动便签跟着挪。用户看到的就是
      // "移动到其他便签后面会导致其他便签随机重排"。
      //
      // 便签本来就允许叠——叠在一起时靠层级决定谁在上面（拖动的那张会提到最前）。
      // 用户手摆的位置是意图，不是需要被"修正"的布局错误。
      const ma = moveArea();
      const c = clampNote(ma, wantX, wantY, w, measured);
      note.style.left = c.x + "px";
      note.style.top = c.y + "px";
      keep = true;
    }
    if (!keep) {
      // 放进当前最空的一列，然后用**实测矩形**一路往下让开障碍。
      //
      // 只靠每列的游标是不够的：用户摆过的那张宽度可能是整条便签道（跨两列），
      // 它会同时挡住两列，而游标只知道"这一列到哪了"。所以这里改成"撞上谁就跑到谁下面"，
      // 这样跨列的老便签也能被正确处理。
      //
      // 注意宽度要**改成列宽**：列位置 colX() 是按 autoW 算的，若还留着更宽的 w，
      // 右边缘就会越出便签道压住线索栏（实测：172 的列里放 232 宽的便签，多出 60px）。
      if (w !== autoW) {
        note.style.width = autoW + "px";
        w = autoW;
        // 宽度变了高度就变了（字要重新折行），必须**重新量一次**：
        // 用改宽度之前的高度去摆放，下一张就会被摆到这张身上，底部的也可能越出屏幕。
        measured = note.getBoundingClientRect().height;
      }
      // 逐列试，按"游标最小优先"的顺序，取**第一个真的放得下**的列。
      //
      // 只挑游标最小的那列然后硬摆是错的：用户手摆过的便签宽度可能是整条道（跨列），
      // 于是某个列虽然游标最小，它的横向范围却正好被那张宽便签压住。摆下去会撞，
      // 撞了就往下载，载到底再夹回来——最后还是撞。实测就是这样在 1060x760 上
      // 留了一对重叠，而**旁边的列其实是空的**。所以：撞了不算数，换一列再试。
      const order = [];
      for (let i = 0; i < cols; i++) order.push(i);
      order.sort((p, q) => cursor[p] - cursor[q]);
      let chosen = -1, cx = b.left, cy = b.top;
      for (const ci of order) {
        const x2 = colX(ci);
        let y2 = cursor[ci];
        for (let guard = 0; guard < 12; guard++) {
          const bl = hitsRect(x2, y2, w, measured);
          if (!bl) break;
          y2 = bl.bottom + NOTE_GAP;
        }
        const yClamp = Math.min(y2, Math.max(b.top, b.bottom - measured));
        if (!hitsRect(x2, yClamp, w, measured)) {
          chosen = ci; cx = x2; cy = yClamp;
          break;
        }
      }
      if (chosen < 0) {
        // 每一列都试过了还是放不下：摆到最空的一列并夹在可视区内，同时记下"溢出"，
        // 让外面多开一列重来。真要三列也放不下，才会保留一个叠住的位置——
        // 叠住至少还看得见、还能拖开，而跑出屏幕的便签用户再也抓不回来。
        overflow = true;
        chosen = order[0];
        cx = colX(chosen);
        cy = Math.min(cursor[chosen], Math.max(b.top, b.bottom - measured));
      }
      note.style.left = cx + "px";
      note.style.top = cy + "px";
      cursor[chosen] = cy + measured + NOTE_GAP;
      // 记下来，等这一遍结束写回服务端：**自动摆放只做一次，之后位置就归这张便签自己。**
      //
      // 不写回的话每次渲染都会重算一遍，而"用户拖了别的便签"会改变计算结果——
      // 于是别的便签跟着挪。用户的原话是"移动到其他便签后面会导致其他便签随机重排"。
      // 上一版只保证"手摆的便签不动"，但**自动摆的便签仍然会动**，症状就换了个形式
      // 回来（实测：把 A 拖到 B 身上，B 从第 2 列跳到第 1 列）。把首次摆放落盘之后，
      // 所有便签都有了自己的坐标，谁也不会因为别人动了而挪位。
      assigned.push({ id: a.id, nx: cx, ny: cy, nw: w, nz: a.nz || 0 });
    } else {
      const r = note.getBoundingClientRect();
      const ci = colOf(r.left);
      cursor[ci] = Math.max(cursor[ci], r.bottom + NOTE_GAP);
    }
    placed.push({ rect: note.getBoundingClientRect(), auto: !keep });
  }
  // "这一遍不合格"只算**自动摆放之间**的相撞。
  //
  // 用户手摆的便签互相叠着，是用户自己摆的，不该让整套自动布局重来一遍——
  // 重来会改变列宽，于是所有自动便签一起挪位，看上去就是"其他便签随机重排"。
  // 自动摆放之间相撞才是真的没摆好（那种情况多开一列就能解决）。
  for (let i = 0; i < placed.length && !overflow; i++) {
    if (!placed[i].auto) continue;
    for (let j = i + 1; j < placed.length; j++) {
      if (placed[j].auto && ovl(placed[i].rect, placed[j].rect)) {
        overflow = true;
        break;
      }
    }
  }
  return { placed: placed.map(p => p.rect), overflowed: overflow, assigned: assigned };
  }
}

function buildNote(a, nx, ny, nw, nh, nz) {
  const note = el("div", "note" + (a.done ? " done" : "") +
    (S.selPlanId === a.id ? " active" : ""));
  note.dataset.id = a.id;
  note.dataset.kind = a.kind || "topic";
  note.style.left = Math.max(0, nx) + "px";
  note.style.top = Math.max(0, ny) + "px";
  note.style.width = nw + "px";
  if (nh) note.style.height = nh + "px";
  note.style.zIndex = 10 + (nz || 0);

  note.appendChild(el("div", "note-band"));

  const head = el("div", "note-head");
  head.appendChild(el("span", "note-grip", "⠿"));
  // 标签：五个小色点，点一下换类别。
  //
  // 这里原来是"一个 10px 的小字，点一下循环到下一种"——用户的原话是"这套标签相当的难用"：
  // 要选到想要的那个得点好几次，而且不知道下一个是什么。中间试过开一个专门的标签编辑
  // 弹窗，用户又把弹窗否掉了（"我的发言计划其实最好不好搞弹出框"）。
  // 现在是五个点平铺：一次点击到位，不弹窗、不循环。颜色本身就是类别，名字放在 title 里
  // ——这也正是用户说的"同类的就同一种颜色就行了"。
  const dots = el("div", "note-dots");
  for (const k of Object.keys(PL_KINDS)) {
    const dot = el("button", "note-dot" + (k === (a.kind || "topic") ? " on" : ""));
    dot.style.background = "var(" + (PL_TOKENS[k] || "--term") + ")";
    dot.style.color = "var(" + (PL_TOKENS[k] || "--term") + ")";
    dot.title = PL_KINDS[k] + "（点一下把这张便签改成" + PL_KINDS[k] + "）";
    dot.onclick = async ev => {
      ev.stopPropagation();
      await prepAction("update", { id: a.id, kind: k });
      tick();
    };
    dots.appendChild(dot);
  }
  head.appendChild(dots);
  head.appendChild(el("div", "spacer"));
  // 变量名**不能**叫 tick：那会遮蔽外层的 tick() 刷新函数，于是"标记已办"和"删除便签"
  // 两个按钮点下去都抛 "tick is not a function"——而且是运行时才炸，语法检查、渲染审计
  // 都看不出来（只有真的点那个按钮才会触发）。同一个坑这个文件里踩过第二次了：
  // PlanItem 的字段名曾经叫 list，遮蔽了内置 list()。
  const doneBtn = el("button", "note-x note-done", a.done ? "↺" : "✓");
  doneBtn.title = a.done ? "标记为未办" : "标记为已办";
  doneBtn.onclick = async ev => {
    ev.stopPropagation();
    await fetch("/api/agenda/mark", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: a.id, done: !a.done }) });
    tick();
  };
  head.appendChild(doneBtn);
  const rm = el("button", "note-x note-del", "×");
  rm.title = "删除这张便签";
  rm.onclick = async ev => {
    ev.stopPropagation();
    await prepAction("remove", { id: a.id });
    tick();
  };
  head.appendChild(rm);
  note.appendChild(head);

  const body = el("div", "note-body");
  const topic = el("div", "note-topic", a.topic);
  topic.contentEditable = "true";
  topic.spellcheck = false;
  topic.title = "双击可直接改字";
  topic.onfocus = () => { S.selPlanId = a.id; };
  topic.onblur = async () => {
    const v = topic.textContent.trim();
    if (v && v !== a.topic) await prepAction("update", { id: a.id, topic: v });
  };
  topic.onkeydown = e => {
    // 便签里打字不能触发全局命令；Enter 结束编辑而不是插入换行。
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); topic.blur(); }
    if (e.key === "Escape") { topic.textContent = a.topic; topic.blur(); }
  };
  body.appendChild(topic);

  const meta = el("div", "note-meta");
  if (a.detail) meta.appendChild(el("span", null, a.detail));
  if (meta.children.length) body.appendChild(meta);

  if (a.seg_id) {
    const seg = [...S.segByIdx.values()].find(s => s.id === a.seg_id);
    if (seg) {
      const from = el("div", "note-from");
      from.textContent = "来源发言：" + seg.text.slice(0, 60) +
        (seg.text.length > 60 ? "…" : "");
      from.onclick = ev => { ev.stopPropagation(); S.follow = false;
        selectSeg(seg.idx, true); };
      body.appendChild(from);
    }
  }

  // 参考依据：钉在便签上的证据。仍然只是参考，不生成话术。
  if ((a.refs || []).length) {
    const wrap = el("div", "note-refs");
    wrap.appendChild(el("div", "note-refs-h", `参考依据 ${a.refs.length}`));
    a.refs.forEach((r, i) => {
      const chip = el("div", "note-ref");
      chip.appendChild(el("div", "note-ref-t", r.title || r.label || "资料"));
      if (r.snippet) {
        chip.appendChild(el("div", "note-ref-x", r.snippet.slice(0, 120) +
          (r.snippet.length > 120 ? "…" : "")));
      }
      const rmv = el("button", "note-ref-rm", "×");
      rmv.title = "移除这条参考";
      rmv.onclick = async ev => {
        ev.stopPropagation();
        await prepAction("detach_ref", { id: a.id, index: i });
        tick();
      };
      chip.appendChild(rmv);
      wrap.appendChild(chip);
    });
    body.appendChild(wrap);
  }
  note.appendChild(body);

  note.appendChild(el("div", "note-resize"));
  makeNoteDraggable(note, a);
  return note;
}

/** Every note's current z-index, so "bring to front" can be computed instead of guessed. */
function noteZiIndexes() {
  return [...document.querySelectorAll("#notes-layer .note")]
    .map(n => parseInt(n.style.zIndex, 10))
    .filter(v => Number.isFinite(v));
}

/** Drag from anywhere on the note, resize from the corner, raise on touch. Persist on release.
 *
 * 这一版修的是一个用户会立刻撞上、而测试自己绕开了的 bug。
 *
 * **症状**：拖着便签走，大约每一秒它自己弹回起点一次，所以"便签移动非常困难"——
 * 手快一点还能挪过去，慢一点就永远到不了。
 *
 * **根因**：`renderNotes()` 每次轮询（约 1 秒）都会 `layer.textContent = ""` 重建整个便签层。
 * 拖拽的处理函数抓着的是 pointerdown 那一刻的**旧元素**；重建之后那个元素已经不在页面上，
 * 于是 `note.style.left = ...` 写进一个没人看得见的节点，而新画出来的那张按服务端存的
 * 位置摆放——就是"弹回起点"。
 *
 * **为什么之前没被发现**：审计器**发现过**它，并把症状写进了注释
 * （"每次 pointermove 都会重算目标位置…每步只累加一小段，实测 8 步只走了 512px"），
 * 然后改成**只派发一步 pointermove** 让断言通过。真实鼠标每秒发几十个 pointermove，
 * 于是测试恰好避开了用户必然遇到的那条路径。这是整个项目里最值得记的一次教训：
 * **为了让测试变绿而缩小输入范围，等于把 bug 藏起来。**
 *
 * 修法两条：拖拽期间不重建便签层（renderNotes 提前返回）；拖拽结束由服务端位置说了算，
 * 下一次重建把最终位置落回界面。另外把抓手从"顶部 24px 的窄条"扩到整张便签——
 * 用户的第一反应是抓正文，而正文是 contentEditable，抓下去只会选中文字。
 */
function makeNoteDraggable(note, a) {
  let mode = null, sx = 0, sy = 0, ox = 0, oy = 0, ow = 0, oh = 0;
  let moved = false, downTarget = null;
  const topicEl = note.querySelector(".note-topic");

  const onDown = (ev, kind) => {
    if (ev.button !== 0) return;
    // 只在正文上阻止默认行为：正文是 contentEditable，不挡住的话按住就是选字。
    // 别处**不能**无脑 preventDefault——在 Chromium 上取消 pointerdown 会让后续的
    // click 不再派发，于是便签里"来源发言：…"这类可点的东西会突然点不动。
    if (topicEl && topicEl.contains(ev.target)) ev.preventDefault();
    ev.stopPropagation();
    mode = kind;
    moved = false;
    downTarget = ev.target;
    sx = ev.clientX; sy = ev.clientY;
    ox = parseFloat(note.style.left) || 0;
    oy = parseFloat(note.style.top) || 0;
    ow = parseFloat(note.style.width) || NOTE_W;
    oh = note.getBoundingClientRect().height;
    // 把这一张提到最前面。
    //
    // 原来是 `note.style.zIndex = ++S.noteZ`，而 `S.noteZ` **从来没有初始化过**——
    // `++undefined` 是 NaN，把 NaN 写进 zIndex 会被浏览器直接忽略，于是便签的层级
    // 一动不动：拖动的那张永远埋在别人下面。用户的原话就是
    // "我希望真正移动的那个便签是最前面的"。
    // 先从当前所有便签里取最大层级，再加一，保证它一定在最上面。
    S.noteZ = Math.max(S.noteZ || 0, ...noteZiIndexes());
    note.style.zIndex = ++S.noteZ;
    S.selPlanId = a.id;
    S.dragId = a.id;      // 拖拽期间 renderNotes 直接返回，不再重建这一层
    note.classList.add("active");
    document.body.style.userSelect = "none";
    // 指针捕获：拖出窗口再松手也能收到 pointerup。
    // 合成事件（测试派发的）没有真实指针，setPointerCapture 会抛错，忽略即可。
    try { note.setPointerCapture(ev.pointerId); } catch (e) { /* 合成事件 */ }
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };

  const onMove = ev => {
    if (!mode) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4 && !moved) {
      moved = true;
      // 开始真的拖了：把可能已经拉出来的文字选区清掉。
      // 用"移动之后清"代替"按下就 preventDefault"，是为了不误伤便签里的点击。
      try { window.getSelection().removeAllRanges(); } catch (e) { /* 无所谓 */ }
    }
    if (mode === "move") {
      // 夹在**整个工作区**里，不夹在便签道里。
      //
      // 这是"不跟手"的真正原因：便签道只有中栏右侧约一半宽，一张 232 宽的便签在里面
      // 横向只剩两百多像素的自由，贴在边上时往左/往上更是**可用空间为 0**——
      // 指针在动、便签不动，用户看到的就是"不跟手"。范围被限制和不跟手，是同一件事。
      const c = clampNote(moveArea(), ox + dx, oy + dy, ow, oh);
      note.style.left = c.x + "px";
      note.style.top = c.y + "px";
    } else {
      const ma = moveArea();
      note.style.width = Math.max(150, Math.min(ma.right - ma.left, ow + dx)) + "px";
      note.style.height = Math.max(90, oh + dy) + "px";
    }
  };

  const enterEdit = ev => {
    if (!topicEl) return;
    topicEl.focus();
    // 顺手把光标放到点下去的位置：不移动的单击 = 开始改字，这是便签最自然的用法。
    try {
      const r = document.caretRangeFromPoint &&
        document.caretRangeFromPoint(ev.clientX, ev.clientY);
      if (r && topicEl.contains(r.startContainer)) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
    } catch (e) { /* 只聚焦也行 */ }
  };

  const onUp = async ev => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    document.body.style.userSelect = "";
    if (!mode) return;
    const wasMode = mode;
    mode = null;
    S.dragId = null;      // 松手后位置由服务端状态说了算，渲染恢复幂等
    try { note.releasePointerCapture(ev && ev.pointerId); } catch (e) { /* 同上 */ }
    // 没移动 = 单击：落在正文上就进入编辑，落在别处就只是选中这张便签。
    if (!moved) {
      if (wasMode === "move" && ev && topicEl && downTarget &&
          topicEl.contains(downTarget)) {
        enterEdit(ev);
      }
      return;             // 没动过就不用写盘
    }
    // 只在松手时写盘：拖拽每秒产生几十个位置，每次写盘会重写整个会话文件。
    await fetch("/api/prep/layout", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: [{
        id: a.id, nx: parseFloat(note.style.left), ny: parseFloat(note.style.top),
        nw: parseFloat(note.style.width),
        nh: note.style.height ? parseFloat(note.style.height) : 0,
        nz: parseInt(note.style.zIndex, 10),
      }] }) });
    tick();
  };

  // 整张便签都能抓，除了真正的控件。
  note.addEventListener("pointerdown", ev => {
    if (ev.target.closest("button, .note-resize")) return;
    onDown(ev, "move");
  });
  note.querySelector(".note-resize").addEventListener("pointerdown", ev => onDown(ev, "resize"));
  note.addEventListener("pointerdown", () => {
    S.selPlanId = a.id;
    S.noteZ = Math.max(S.noteZ || 0, parseInt(note.style.zIndex, 10) || 0);
  });
}

function renderPlanList(cfg) {
  const box = $(cfg.list);
  const items = cfg.items || [];
  $(cfg.count).textContent = items.length;
  const root = $("#plan-agenda");
  root.classList.toggle("open", !!S.agendaOpen);
  $("#pa-toggle").textContent = S.agendaOpen ? "收起" : "展开";
  box.textContent = "";

  if (!items.length) {
    box.appendChild(el("div", "pl-empty",
      "还没有会议流程。点「导入」读主持人给的 docx / md / txt，或直接手写。"));
  }

  for (const a of items) {
    const row = el("div", "pl-item" + (a.done ? " done" : "") + " " + (a.kind || "topic"));
    const tickEl = el("div", "pl-tick");
    tickEl.title = a.done ? "标记为未谈" : "标记为已谈";
    tickEl.onclick = async ev => {
      ev.stopPropagation();
      await fetch("/api/agenda/mark", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: a.id, done: !a.done }) });
      tick();
    };
    row.appendChild(tickEl);

    const body = el("div", "pl-body");
    // 议题可双击改名——导入的解析结果不可能百分之百准，必须能就地修。
    const topic = el("div", "pl-topic", a.topic);
    topic.title = "双击改名";
    topic.ondblclick = async ev => {
      ev.stopPropagation();
      const v = prompt("修改内容：", a.topic);
      if (v == null || !v.trim()) return;
      const list = S.agenda.map(x => ({ id: x.id, topic: x.topic, kind: x.kind,
        detail: x.detail, done: x.done, speaker: x.speaker, slot: x.slot }));
      const hit = list.find(x => x.id === a.id);
      if (hit) hit.topic = v.trim();
      await fetch("/api/agenda", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: list }) });
      tick();
    };
    body.appendChild(topic);

    const meta = el("div", "pl-meta");
    if (a.slot) meta.appendChild(el("span", "pl-slot", a.slot));
    if (a.speaker) meta.appendChild(el("span", "pl-who", a.speaker));
    if (a.detail) meta.appendChild(el("span", null, a.detail));
    if (meta.children.length) body.appendChild(meta);
    row.appendChild(body);

    const rmv = el("button", "pl-rm", "×");
    rmv.title = "删除";
    rmv.onclick = async ev => {
      ev.stopPropagation();
      await fetch("/api/prep", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "remove", id: a.id }) });
      tick();
    };
    row.appendChild(rmv);
    box.appendChild(row);
  }

  // 手写加一项流程：agenda 是整表替换，所以带上现有项一起提交。
  const add = el("div", "pl-add");
  const inp = el("input");
  inp.placeholder = "加一项流程…";
  inp.spellcheck = false;
  inp.onkeydown = async e => {
    if (e.key !== "Enter" || !inp.value.trim()) return;
    const list = S.agenda.map(x => ({ id: x.id, topic: x.topic, kind: x.kind,
      detail: x.detail, done: x.done, speaker: x.speaker, slot: x.slot }));
    list.push({ topic: inp.value.trim(), kind: "topic" });
    await fetch("/api/agenda", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: list }) });
    inp.value = "";
    S.agendaOpen = true;
    tick();
  };
  add.appendChild(inp);
  box.appendChild(add);
}

async function prepAction(action, payload) {
  const r = await fetch("/api/prep", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ action }, payload)) });
  const d = await r.json();
  if (d.error) toast(d.error);
  return d;
}

$("#pa-head").onclick = e => {
  if (e.target.closest(".pl-btn")) return;      // 「导入」按钮自己处理
  S.agendaOpen = !S.agendaOpen;
  renderPlans();
};
$("#pa-toggle").onclick = e => { e.stopPropagation();
  S.agendaOpen = !S.agendaOpen; renderPlans(); };

// ── 导入（会议流程 / 发言计划稿）─────────────────────────────────────
// 归属必须由用户亲口选，不能靠默认值猜。会议流程是"每次会议都不同的工作文档"，
// 进了公共库就会去回答别的项目的问题，而且开完会就过期了；合同和资质反过来。
// 上一版把这件事藏在一个默认值里，于是"导入默认进全局库"和"会议流程也要导入"
// 撞成了同一个 bug。现在把它摆在面板上，两个选项各自写清后果。
let impScope = "project";

const IMP_SCOPES = [
  ["project", "项目库", "会议流程、纪要、进度——每次会议都不同的工作文档。" +
              "进项目库，不会跑去回答其它项目的问题"],
  ["global", "公共库", "合同、资质、规范——真正共享的参考资料。" +
             "进公共库后每个项目都能检索到"],
  ["session", "仅本次会议", "只在这次会话里用，不写进任何知识库"],
];

function paintImportScopes() {
  const box = $("#imp-scope");
  box.innerHTML = "";
  for (const [id, name, hint] of IMP_SCOPES) {
    const lab = el("label", "st-opt" + (id === impScope ? " on" : ""));
    const radio = el("input");
    radio.type = "radio"; radio.name = "imp-scope"; radio.checked = id === impScope;
    radio.onchange = () => { impScope = id; paintImportScopes(); };
    const txt = el("div");
    txt.appendChild(el("div", "st-opt-t", name));
    txt.appendChild(el("div", "st-opt-h", hint));
    lab.appendChild(radio); lab.appendChild(txt);
    box.appendChild(lab);
  }
}

function openImport(title, defPath) {
  $("#imp-title").textContent = title;
  $("#imp-path").value = defPath || "";
  $("#imp-msg").textContent = "";
  $("#imp-msg").className = "st-msg";
  const pdir = (S.corpora && S.corpora.project_dir) || "";
  $("#imp-hint").textContent = pdir
    ? "当前项目：" + pdir
    : "本次启动没有指定项目文件夹，只能选「公共库」或「仅本次会议」";
  impScope = "project";
  // 没挂项目时"项目库"不是一个真实去处，别让用户选了一个不存在的目标
  if (!pdir) impScope = "global";
  paintImportScopes();
  $("#imp-ok").disabled = false;
  $("#imp").classList.add("on");
  setTimeout(() => $("#imp-path").focus(), 30);
}
function closeImport() { $("#imp").classList.remove("on"); }

$("#imp-cancel").onclick = closeImport;
$("#imp").onclick = e => { if (e.target.id === "imp") closeImport(); };
$("#imp-path").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); $("#imp-ok").onclick(); }
  if (e.key === "Escape") { closeImport(); }
});

$("#imp-ok").onclick = async () => {
  const path = $("#imp-path").value.trim();
  const msg = $("#imp-msg");
  if (!path) { msg.className = "st-msg bad"; msg.textContent = "先填文件路径"; return; }
  $("#imp-ok").disabled = true;
  msg.className = "st-msg"; msg.textContent = "正在解析…";
  let d;
  try {
    d = await (await fetch("/api/agenda/import", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path, scope: impScope }) })).json();
  } catch (err) {
    msg.className = "st-msg bad"; msg.textContent = "请求失败：" + err;
    $("#imp-ok").disabled = false;
    return;
  }
  if (d.error) {
    msg.className = "st-msg bad";
    msg.textContent = d.error + (d.note ? "（" + d.note + "）" : "");
    $("#imp-ok").disabled = false;
    return;
  }
  S.agendaOpen = true;
  closeImport();
  // 说清"文件去了哪、有没有进库"——用户下一步要去 Obsidian 里找它，
  // 或者要确认它没污染别的项目，这两件事都不能靠猜。
  const ix = d.indexed;
  let extra = "";
  if (ix && ix.ok && ix.indexed) {
    extra = `，已入${ix.kb}库（+${ix.added} 新增 / ${ix.chunks} 段）→ ${ix.copied_to}`;
  } else if (ix && ix.ok) {
    extra = `，已复制到 ${ix.copied_to}（${ix.note || "未入库"}）`;
  } else if (ix && ix.error) {
    extra = `，但入库失败：${ix.error}`;
  } else {
    extra = "，仅本次会议，未入库";
  }
  toast(`导入 ${d.count} 项流程${extra}`, 5200);
  tick();
};

$("#pa-import").onclick = e => {
  e.stopPropagation();
  openImport("导入会议流程",
    "E:\\markdown\\meeting-assistant\\data\\outlines\\meeting-outline.docx");
};

// ── 设置 ────────────────────────────────────────────────────────────
// 五节的划分跟着"谁能替换"走，而不是跟着代码结构走：
//   · 语音识别 / 检索 —— 内置，不可替换。列出来是为了能自查状态，不是为了配路径。
//   · 大模型 —— 可选，指哪打哪。缺了它助手降级而不是瘫痪，所以交给用户选。
//   · 知识库 / 界面 —— 属于本机环境。
const ST_SECTIONS = [
  { id: "asr", name: "语音识别", sub: "内置 · 不联网", hk: "asr",
    intro: "转写是这台软件的输入来源，所以它<b>内置且不依赖网络</b>——" +
           "它的使用场景正是一间可能没有外网的会议室。" },
  { id: "embedding", name: "检索", sub: "内置 · 不联网", hk: "embedding",
    intro: "嵌入模型把发言和资料变成可检索的向量。它<b>随软件提供</b>：" +
           "索引是离线建好落盘的，几年后也必须能复现，不能依赖任何订阅。" },
  { id: "llm", name: "大模型", sub: "可选 · 接你手上的服务", hk: "llm",
    intro: "大模型只做两件增强：从发言里抽关键词、给线索分类。" +
           "<b>缺了它会降级，不会瘫痪</b>——规则分类照常工作。" +
           "所以它最适合指向你已经有的东西：本机 llama.cpp，或任意 OpenAI 兼容接口。" },
  { id: "corpora", name: "知识库", sub: "项目库与公共库", hk: null,
    intro: "分两个库的理由是<b>生命周期</b>，不是性能：公共库装合同、资质、规范，" +
           "很少变；项目库装纪要、进度，每开一次会就长一截。" +
           "项目库索引放在项目文件夹里，所以整个文件夹自带知识。" },
  { id: "ui", name: "界面", sub: "本机", hk: null, intro: "" },
];

// 枚举型字段给选择框而不是文本框：手打 "bge-small-zh" 打错一个字母，
// 报错要等到索引建完才出现，而那时已经晚了。
const ST_OPTS = {
  "llm.provider": [["openai_compatible", "OpenAI 兼容接口（llama.cpp / vLLM / DeepSeek / OpenAI）"],
                   ["claude_cli", "本机 claude 命令行"],
                   ["none", "关闭（只用规则分类）"]],
  "embedding.backend": [["bge-small-zh", "bge-small-zh · 中文够用 · 23.9MB"],
                        ["bge-m3", "bge-m3 · 多语言 · 568MB"]],
  "asr.engine": [["funasr", "FunASR · Paraformer 流式 + 离线二遍（默认）"],
                ["firered", "FireRedASR2S · AED + 流式 VAD + BERT 标点（更准 · 需 GPU · 约 5GB）"]],
  "asr.device": [["cuda:0", "cuda:0（显卡）"], ["cpu", "cpu"]],
  "ui.theme": [["dark", "暗色（主打）"], ["light", "亮色"]],
};

// 这些是在服务启动时加载的（ASR 模型 / 嵌入索引 / 知识库），改完必须重启才生效；
// 其余（大模型走环境变量、主题存浏览器）改完立即生效。分开提示，别让用户以为
// "切了引擎没反应 = 坏了"。
// **这份清单的唯一出处是 scripts/meeting/settings.py 的 RESTART_KEYS**，由
// /api/settings 回传（不再在这里抄一份，免得两边漂移）。
let ST_RESTART_KEYS = new Set();

let ST = null, stSection = "asr", stPending = {};

async function openSettings() {
  $("#settings").classList.add("on");
  $("#st-msg").className = "st-msg";
  $("#st-msg").textContent = "正在读取…";
  await reloadSettings();
}
function closeSettings() {
  $("#settings").classList.remove("on");
  stPending = {};
}

async function reloadSettings() {
  try {
    ST = await (await fetch("/api/settings")).json();
  } catch (err) {
    $("#st-msg").className = "st-msg bad";
    $("#st-msg").textContent = "读取设置失败：" + err;
    return;
  }
  // 需要重启才生效的键由服务端给（settings.py 的 RESTART_KEYS，唯一出处）
  ST_RESTART_KEYS = new Set(ST.restart_keys || []);
  stPending = {};
  paintSettingsTabs();
  paintSettings();
  $("#st-restart").hidden = true;
  $("#st-msg").textContent = "";
}

function paintSettingsTabs() {
  const box = $("#st-tabs");
  box.innerHTML = "";
  for (const sec of ST_SECTIONS) {
    const b = el("button", "st-tab" + (sec.id === stSection ? " on" : ""));
    // 只有真有健康检查的节才画圆点。知识库和界面没有可查的后端，
    // 给它们一个灰点会读成"这一节有问题/未检查"，而其实是"没什么可查的"。
    const hk = stHealthClass(sec.hk);
    if (hk) b.appendChild(el("span", "st-dot" + hk));
    b.appendChild(el("span", null, sec.name));
    b.onclick = () => { stSection = sec.id; paintSettingsTabs(); paintSettings(); };
    box.appendChild(b);
  }
}

function stHealthClass(hk) {
  if (!hk || !ST || !ST.health || !ST.health[hk]) return "";
  return ST.health[hk].ok ? " ok" : " bad";
}

function markDirty(key, value) {
  stPending[key] = value;
  $("#st-msg").className = "st-msg";
  $("#st-msg").textContent = `${Object.keys(stPending).length} 项待保存`;
}

function stField(row) {
  const key = row.key;
  const opts = ST_OPTS[key];
  let input;
  if (opts) {
    input = el("select", "st-in");
    const vals = opts.map(o => o[0]);
    // 当前值不在候选里就把它补进去，绝不静默改写用户已有的值
    const list = vals.includes(String(row.value))
      ? opts : [[String(row.value), String(row.value) + "（当前值）"]].concat(opts);
    for (const [v, label] of list) {
      const o = el("option", null, label);
      o.value = v;
      input.appendChild(o);
    }
    input.value = String(row.value);
    input.onchange = () => { input.classList.add("dirty"); markDirty(key, input.value); };
  } else if (row.type === "bool") {
    const wrap = el("label", "st-chk");
    input = el("input");
    input.type = "checkbox";
    input.checked = !!row.value;
    const state = el("span", null, input.checked ? "已开启" : "已关闭");
    input.onchange = () => {
      state.textContent = input.checked ? "已开启" : "已关闭";
      markDirty(key, input.checked);
    };    wrap.appendChild(input); wrap.appendChild(state);
    return wrap;
  } else {
    input = el("input", "st-in");
    input.type = row.type === "secret" ? "password" : (row.type === "int" ? "number" : "text");
    input.spellcheck = false;
    if (row.type === "secret") {
      // 密钥不回传，所以格子永远是空的。留空 = 不改 —— 用户只是来改超时时间时，
      // 不能把一把好用的 key 顺手抹掉。
      input.value = "";
      input.placeholder = row.is_set ? "已设置 · 留空表示不改" : "未设置";
      input.autocomplete = "new-password";
    } else {
      input.value = row.value == null ? "" : row.value;
    }
    input.oninput = () => {
      input.classList.add("dirty");
      markDirty(key, input.value);
    };
    return input;
  }
  // 初画一律不加 .dirty —— 高亮表示"改过了"，一打开就满屏高亮等于没有提示
  return input;
}

function paintSettings() {
  const sec = ST_SECTIONS.find(s => s.id === stSection) || ST_SECTIONS[0];
  $("#st-title").textContent = sec.name;
  $("#st-sub").textContent = sec.sub || "";
  const h = sec.hk && ST.health ? ST.health[sec.hk] : null;
  const tag = $("#st-state");
  tag.className = "st-tag" + (h ? (h.ok ? " ok" : " bad") : "");
  tag.textContent = h ? (h.ok ? "可用" : "不可用") : "";

  const body = $("#st-body");
  body.innerHTML = "";

  if (sec.intro) {
    const note = el("div", "st-note");
    note.innerHTML = sec.intro;
    body.appendChild(note);
  }
  // 健康状态放在最上面，因为用户打开设置最想问的就是"它现在能不能用"。
  // check() 是真的去看了模型目录 / 配置完整性，不是读一个布尔值。
  if (h && !h.ok) {
    const warn = el("div", "st-note warn");
    warn.innerHTML = "<b>不可用：</b>" + esc(h.detail || "");
    body.appendChild(warn);
  } else if (h && h.detail) {
    const ok = el("div", "st-note");
    ok.innerHTML = esc(h.detail);
    body.appendChild(ok);
  }

  // 知识库一节先摆"本次会话实际在用哪个库"——因为下面那几行是可改的路径，
  // 而改完要重启才生效。不说清这一点，用户会以为改了没反应是坏了。
  if (sec.id === "corpora" && ST.corpora) {
    const kv = el("div", "st-kv");
    const rows = [
      ["项目", ST.corpora.project_name || "（未指定）"],
      ["项目文件夹", ST.corpora.project_dir || "（未指定，本次不建项目库）"],
      ["项目库索引", ST.corpora.project_db || "—"],
      ["公共库索引", ST.corpora.global_db || "—"],
      ["公共库语料", ST.corpora.global_kb || "—"],
    ];
    for (const [k, v] of rows) {
      const line = el("div");
      line.appendChild(el("i", null, k));
      line.appendChild(document.createTextNode(v));
      kv.appendChild(line);
    }
    body.appendChild(kv);
    const warn = el("div", "st-note warn");
    warn.innerHTML = "下面几行改动<b>需要重启服务才生效</b>——知识库是在启动时打开的，" +
                     "换了路径不会中途换库。";
    body.appendChild(warn);
  }

  // 界面这一节本来是"主题"这类本地偏好，但要在这里放一个「再看一遍使用引导」的入口：
  // 引导只自动弹一次，第一次没看清、或者换个人用这台机器，就必须有个地方能找到它，
  // 否则"只弹一次"等于"永远回不去"。控件照抄上面通用行的三层结构（标签 / 控件 / 提示），
  // 免得又多出一种行样式。
  if (sec.id === "ui") {
    const gRow = el("div", "st-row");
    gRow.dataset.key = "ui.guide";
    const gCell = el("div");
    const gBtn = el("button", "btn ghost", "再看一遍使用引导");
    gBtn.onclick = () => { closeSettings(); openGuide(); };
    gCell.appendChild(gBtn);
    gRow.appendChild(el("div", "st-lab", "使用引导"));
    gRow.appendChild(gCell);
    gRow.appendChild(el("div", "st-hint",
      "第一次打开界面时自动出现一次；这里可以随时再看。按 ? 只弹快捷键提示。"));
    body.appendChild(gRow);
  }

  const rows = (ST.settings.groups || {})[sec.id] || [];
  for (const row of rows) {
    const r = el("div", "st-row");
    // data-key 让自动化能按设置项定位到行，而不是靠中文标签做字符串匹配——
    // 改一次文案就断的测试，等于没有测试。
    r.dataset.key = row.key;
    const lab = el("div", "st-lab", row.label);
    r.appendChild(lab);
    r.appendChild(stField(row));
    const bits = [];
    if (row.hint) bits.push(row.hint);
    if (row.source) bits.push("来源：" + row.source);
    if (bits.length) {
      const hint = el("div", "st-hint");
      hint.innerHTML = esc(bits.join(" · "));
      r.appendChild(hint);
    }
    body.appendChild(r);
  }

  $("#st-path").textContent = ST.settings.exists ? "已保存到 settings.json" : "尚未保存过";
  $("#st-path").title = ST.settings.path || "";
}

async function saveSettings() {
  const keys = Object.keys(stPending);
  const msg = $("#st-msg");
  if (!keys.length) { msg.className = "st-msg"; msg.textContent = "没有改动"; return; }
  $("#st-save").disabled = true;
  msg.className = "st-msg"; msg.textContent = "正在保存…";
  try {
    const r = await fetch("/api/settings", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ set: stPending }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    ST = { settings: d.settings, health: d.health, corpora: ST.corpora,
           restart_keys: d.restart_keys || ST.restart_keys,
           managed: !!d.managed };
    stPending = {};
    paintSettingsTabs();
    paintSettings();
    if (d.errors && d.errors.length) {
      msg.className = "st-msg bad";
      msg.textContent = "部分未保存：" + d.errors.join("；");
    } else {
      msg.className = "st-msg ok";
      // 大部分设置（大模型/主题）改完立即生效；但 ASR 引擎、模型目录、嵌入、知识库
      // 是启动时加载的，改完必须重启。诚实地分开说，别让用户以为"没反应 = 坏了"。
      const restarts = d.changed.filter(c => ST_RESTART_KEYS.has(c.key));
      if (restarts.length) {
        const names = restarts.map(c => c.key.split(".")[1]).join("、");
        const canRestart = !!(ST.managed || S.managed);
        msg.textContent = `已保存 ${d.changed.length} 项 · ${names} 需重启服务后生效` +
          (canRestart ? "" : "（本次不是启动器启动的，请手动重启）");
        // 由启动器托管时，给一个按钮直接重启——否则用户只能关掉整个应用重开
        $("#st-restart").hidden = !canRestart;
      } else {
        // "立即生效"是有依据的：服务端把设置写进 os.environ，而 llm_client 读的就是它，
        // 所以下一次调用就用新值，不用重启。
        msg.textContent = `已保存 ${d.changed.length} 项，立即生效（无需重启）`;
        $("#st-restart").hidden = true;
      }
      // 主题是本机偏好，存在浏览器里；服务端存了一份是为了换台机器也带走
      if (d.changed.some(c => c.key === "ui.theme")) {
        const t = (ST.settings.groups.ui || []).find(x => x.key === "ui.theme");
        if (t && t.value !== currentTheme()) applyTheme(t.value);
      }
    }
  } catch (err) {
    msg.className = "st-msg bad";
    msg.textContent = "保存失败：" + err;
  } finally {
    $("#st-save").disabled = false;
  }
}

$("#btn-settings").onclick = openSettings;
$("#st-close").onclick = closeSettings;
$("#st-save").onclick = saveSettings;

// 「重启服务」：进程没法重启自己（ASR 模型、嵌入后端、知识库都是启动时加载的），
// 所以请启动器代劳——服务端写一个标记文件，启动器把子进程重启一遍。
// 期间界面会短暂连不上，这里会显示"服务暂时不可用"，恢复后自己接上（见 boot）。
$("#st-restart").onclick = async () => {

    msg.textContent = "已请求重启：界面恢复后会自动接上，模型加载期间录音按钮不可用";
    toast("正在重启服务…（ASR 模型重新加载中）", 6000);
  } catch (err) {
    msg.className = "st-msg bad";
    msg.textContent = "重启失败：" + err;
  } finally {
    btn.disabled = false;
  }
};

// ── 发言计划：输入框直接生成便签 ─────────────────────────────────────
// 这里原来是一个弹窗编辑器（列出发言计划、点标签、调顺序）。用户否掉了它：
// "我的发言计划其实最好不好搞弹出框，容易造成麻烦。其实最好是自己做个输入框，
//  输入文字后自己点击新便签生成。"
//
// 理由是对的：写要点是开会时反复做的小动作，弹窗要多一次开关、要点外面才看得见自己
// 刚写的东西。现在就是条上这个输入框——打字、回车、便签出现在发言流右侧。
//
// 标签改到便签自己身上：头部的五个小色点，点一下换个类别。不弹窗、不循环点。
// 顺序不再手工排——便签按你摆的位置说话，位置本身就是顺序。

  if (S.notesHidden) { toggleNotes(); }
