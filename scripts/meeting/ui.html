// ── 统一指针拖拽 ────────────────────────────────────────────────────
// 两种拖拽来源，落点语义不同：
//   发言流的一段   -> "我要讲这件事"      -> 新建一张便签
//   右栏的一条参考 -> "我讲这个时有依据"  -> 附到某张便签上当参考
// 第二条是关键：领导临时问"这个按钮为什么这么设计"，把检索到的合同条款钉到便签上，
// 但**怎么组织语言仍然是用户自己的事**。所以参考只做证据，不生成话术。
//
// 为什么不用 HTML5 拖拽（dragstart/drop）：第一版用它是错的，用户实测"拖拽都非常难"。
// 原因有三，都是 HTML5 拖拽的固有毛病：
//   · 必须拖过系统阈值才真正开始，短距离拖动毫无反应，手感发飘；
//   · 拖影是浏览器生成的半透明快照，位置和样式都不受控，落点不明确；
//   · 落点判断依赖目标元素触发 dragover，便签层 pointer-events:none 时经常收不到事件。
// 换成 pointerdown/pointermove/pointerup 后：立即响应、提示跟手、落点自己算。
// 便签拖动本来就是指针实现，现在三种拖拽共用同一套机制，手感一致。
let dragState = null;      // {kind:'seg'|'ref', idx, ref, ghost, card}

function beginDrag(ev, kind, payload) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  // 不 setPointerCapture：拖拽目标是"指针下方的元素"，捕获会把事件全锁在源元素上。
  dragState = Object.assign({ kind }, payload, { ghost: null, el: null });
  document.body.style.userSelect = "none";
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragUp);
}

function onDragMove(ev) {
  if (!dragState) return;
  const d = dragState;
  // 超过 4px 才算开始拖，避免"点一下选中"被误判成拖拽
  if (!d.ghost) {
    if (Math.hypot(ev.clientX - d.sx0, ev.clientY - d.sy0) < 4) return;
    if (d.kind === "seg") {
      const s = S.segByIdx.get(d.idx);
      d.ghost = makeGhost("新建便签", s ? s.text.slice(0, 40) : "");
      d.el = document.querySelector('#feed .utt[data-idx="' + d.idx + '"]');
      d.el && d.el.classList.add("dragging");
    } else {
      d.ghost = makeGhost("作为参考钉到便签", (d.ref.title || "").slice(0, 40));
      d.srcEl && d.srcEl.classList.add("dragging");
    }
  }
  moveGhost(ev);

  // 落点：指针下方是不是一张便签
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const note = under && under.closest ? under.closest("#notes-layer .note") : null;
  document.querySelectorAll(".note.refdrop").forEach(n => n.classList.remove("refdrop"));
  if (note) {
    note.classList.add("refdrop");
    const it = S.prep.find(p => p.id === note.dataset.id);
    setGhostText(d.kind === "ref"
      ? "钉到「" + ((it ? it.topic : "")).slice(0, 12) + "」当参考"
      : "拖到右边的「＋ 新便签」旁松手新建；或直接松手新建一张");
  } else if (d.kind === "ref") {
    setGhostText("松手：新建一张便签并附上这条参考");
  } else {
    setGhostText("松手：新建一张便签");
  }
}

async function onDragUp(ev) {
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", onDragUp);
  document.body.style.userSelect = "";
  const d = dragState;
  dragState = null;
  if (!d) return;
  document.querySelectorAll(".dragging").forEach(n => n.classList.remove("dragging"));
  document.querySelectorAll(".note.refdrop").forEach(n => n.classList.remove("refdrop"));
  if (d.ghost) d.ghost.remove();
  // 没超过阈值 = 一次点击，不是拖拽
  if (!d.ghost) return;

  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const noteEl = under && under.closest ? under.closest("#notes-layer .note") : null;

  if (d.kind === "seg") {
    const seg = S.segByIdx.get(d.idx);
    if (!seg) return;
    const r = await prepAction("add", {
      topic: seg.text.length > 28 ? seg.text.slice(0, 28) : seg.text,
      detail: seg.speaker ? "相关发言人：" + seg.speaker : "",
      seg_id: seg.id,
      source: seg.text.slice(0, 80),
      // 松在哪儿就摆哪儿——这是"可以在界面内随意拖放"的直接兑现
      nx: Math.max(0, Math.min(innerWidth - 80, ev.clientX - 60)),
      ny: Math.max(56, Math.min(innerHeight - 40, ev.clientY - 14)),
    });
    if (d.error) { toast(d.error, 3000); return; }
    S.notesHidden = false;
    $("#notes-layer").classList.remove("hidden");
    toast("已新建一张便签");
    tick();
    return;
  }

  // 参考：优先钉到指针下的那张便签，否则钉到当前选中的，再否则新建一张承载它
  const targetId = noteEl ? noteEl.dataset.id
    : (S.prep.some(p => p.id === S.selPlanId) ? S.selPlanId : "");
  const r2 = await prepAction("attach_ref", { id: targetId, ref: d.ref });
  if (r2.error) { toast(r2.error, 3000); return; }
  S.notesHidden = false;
  $("#notes-layer").classList.remove("hidden");
  const it = S.prep.find(p => p.id === (r2.item || {}).id);
  toast(r2.created
    ? "已新建一张便签并附上这条参考"
    : "已钉到「" + ((it ? it.topic : "")).slice(0, 12) + "」当参考", 3000);
  tick();
}

function makeGhost(title, sub) {
  const g = el("div", "drag-ghost");
  g.innerHTML = "<b>" + esc(title) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "");
  document.body.appendChild(g);
  return g;
}
function setGhostText(text) {
  if (!dragState || !dragState.ghost) return;
  const b = dragState.ghost.querySelector("b");
  if (b) b.textContent = text;
}
function moveGhost(ev) {
  const g = dragState && dragState.ghost;
  if (!g) return;
  g.style.left = Math.min(innerWidth - 40, ev.clientX + 14) + "px";
  g.style.top = Math.min(innerHeight - 20, ev.clientY + 16) + "px";
}

// 发言段的拖拽柄：只有柄能起拖，所以整行文字仍可选中复制
document.addEventListener("pointerdown", ev => {
  const grip = ev.target.closest && ev.target.closest(".u-grip");
  if (!grip) return;
  const utt = grip.closest(".utt");
  if (!utt) return;
  beginDrag(ev, "seg", { idx: +utt.dataset.idx, sx0: ev.clientX, sy0: ev.clientY,
                         srcEl: utt });
});

// 右栏检索卡 / 详情里的资料卡：整卡可拖
document.addEventListener("pointerdown", ev => {
  if (ev.target.closest && ev.target.closest("button")) return;
  const card = ev.target.closest && ev.target.closest("[data-ref]");
  if (!card) return;
  let ref = null;
  try { ref = JSON.parse(card.dataset.ref || "null"); } catch (_) { ref = null; }
  if (!ref) return;
  beginDrag(ev, "ref", { ref, sx0: ev.clientX, sy0: ev.clientY, srcEl: card });
});

// ── 右栏：线索 ──────────────────────────────────────────────────────
function renderFilters() {
  const box = $("#filters");
  const counts = {};
  for (const c of S.clues) counts[c.kind] = (counts[c.kind] || 0) + 1;
  const order = Object.keys(S.types);
  box.textContent = "";
  // 只用颜色点，不写类型名——同色即同类。筛选项本来就该一眼扫过去，
  // 而一排中文标签要逐个读完才知道有哪些类别。
  const mk = (key, label, n, tone) => {
    const b = el("span", "fchip" + (S.filter.has(key) ? " on" : ""));
    const dot = el("i", "fdot");
    if (tone) dot.dataset.tone = tone;
    else dot.dataset.tone = "all";
    b.appendChild(dot);
    b.appendChild(el("span", null, label));
    if (n) b.appendChild(el("span", "n", String(n)));
    b.title = key ? (label + "（" + n + " 条）") : "显示全部";
    b.onclick = () => {
      if (!key) { S.filter.clear(); }
      else if (S.filter.has(key)) S.filter.delete(key);
      else S.filter.add(key);
      renderFilters(); renderClues();
    };
    box.appendChild(b);
  };
  mk(null, "全部", S.clues.length, null);
  for (const k of order) if (counts[k]) mk(k, "", counts[k], S.types[k].tone);
}

function renderClues() {
  renderFilters();
  const box = $("#clues");
  let list = S.clues.slice();
  if (S.filter.size) list = list.filter(c => S.filter.has(c.kind));
  // 当前发言的线索排在最前：右栏的职责是佐证"这一句"，不是罗列全部历史。
  const cur = S.selected != null ? S.segByIdx.get(S.selected) : null;
  if (cur) {
    list.sort((a, b) =>
      (b.seg_id === cur.id ? 1 : 0) - (a.seg_id === cur.id ? 1 : 0));
  }
  box.textContent = "";
  if (!list.length) {
    box.innerHTML = '<div class="empty" style="padding:26px 12px">' +
      (S.clues.length ? "该筛选下没有线索" : "还没有线索<br>识别到内容后会自动分类") + "</div>";
    return;
  }
  for (const c of list) {
    const card = el("div", "clue" + (c.pinned ? " pinned" : "") +
      (S.detailFor === c.id ? " sel" : ""));
    card.dataset.tone = c.meta.tone;
    // 线索卡本身就可拖：把它拖进「我的发言计划」是把"这段有依据"钉下来的最直接方式。
    card.dataset.ref = JSON.stringify({
      title: (c.anchor || c.text || "").slice(0, 40),
      snippet: c.text || "",
      label: c.meta.label, rel: "线索", score: Math.round(c.confidence * 100) / 100,
    });
    const top = el("div", "c-top");
    const kind = el("span", "c-kind badge " + c.meta.tone, c.meta.label);
    top.appendChild(kind);
    top.appendChild(el("span", "c-time", fmtT(c.t)));
    if (c.actor) top.appendChild(el("span", "c-time", c.actor));
    if (c.due) top.appendChild(el("span", "c-time", "期限 " + c.due));
    const conf = el("span", "c-conf");
    conf.innerHTML = `<span class="c-bar"><i style="width:${Math.round(c.confidence * 100)}%"></i></span>` +
      Math.round(c.confidence * 100) + "%";
    conf.title = "置信度（规则命中的日期/机构更确定，模型判断的意图较弱）";
    top.appendChild(conf);
    card.appendChild(top);
    // 线索文案偶尔会把下一句的开头一起吞进来（"这个时间不能再往后退了软件部署调"），
    // 那是 ASR 在保护带里把两段接上造成的，不是分类错误。卡片上只显示到能看懂为止，
    // 完整文本放 tooltip——列表要能扫，详情里才需要完整。
    const ctext = (c.text || "").trim();
    const shown = ctext.length > 22 && c.anchor && ctext.includes(c.anchor)
      ? c.anchor : ctext;
    const ctextEl = el("div", "c-text", shown);
    if (shown !== ctext) ctextEl.title = ctext;
    card.appendChild(ctextEl);
    const src = S.segments.find(x => x.id === c.seg_id);
    if (src) {
      const q = el("div", "c-src");
      q.innerHTML = mdTerms(src.text, [c.anchor]);
      card.appendChild(q);
    }
    const acts = el("div", "c-acts");
    const pin = el("span", "c-act", c.pinned ? "取消置顶" : "置顶");
    pin.onclick = async ev => { ev.stopPropagation();
      await fetch("/api/clue", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: c.id, pinned: !c.pinned }) }); tick(); };
    const retype = el("span", "c-act", "改类别");
    retype.onclick = ev => { ev.stopPropagation(); cycleKind(c); };
    const rm = el("span", "c-act danger", "删除");
    rm.onclick = async ev => { ev.stopPropagation();
      await fetch("/api/clue", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: c.id, action: "remove" }) }); tick(); };
    acts.append(pin, retype, rm);
    card.appendChild(acts);
    card.onclick = () => openDetail(c);
    box.appendChild(card);
  }
}

function cycleKind(c) {
  const keys = Object.keys(S.types);
  const i = keys.indexOf(c.kind);
  const next = keys[(i + 1) % keys.length];
  fetch("/api/clue", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: c.id, kind: next }) }).then(tick);
  toast("类别改为 " + S.types[next].label);
}

/** 把 Markdown **源码**渲染成可读结构——只用于展示片段。
 *
 * 为什么需要它：语料库里的文档都是 Markdown，佐证面板和悬浮框原来直接把源码贴出来，
 * 于是屏幕上全是 `### 标题`、``` 代码围栏、`| a | b |` 表格行、`---` 分隔线——
 * 用户的原话是"显示的都还是编辑状态的形式，阅读体验非常糟糕"。
 *
 * **只做块级结构 + 少量行内**，不做完整 Markdown：
 *   ``` 围栏 → 代码块；| 表 | → 真表格；# 标题 → 小标题（不放大，面板里空间小）；
 *   - / 1. 列表 → 列表；> 引用 → 引用块；**粗** `代码` [文字](链接) → 行内样式。
 *
 * 输入必须是**已经转义过**的文本（`markTerms` 的输出）。这里绝不再转义，
 * 也绝不用 innerHTML 拼未转义的内容——语料来自用户的文档，不能当代码执行。
 */
/** 源文档里**内嵌的 HTML 表格** → 干净的真表格。
 *
 * 语料里的表格常常是这种（导出工具生成的，整个表格挤在一行）：
 *   <table><tr><td rowspan=1 colspan=1>操作</td><td rowspan=1 colspan=1>方式</td></tr>…</table>
 * 转义后就是用户看到的那一串 `&lt;td rowspan=1 colspan=1&gt;…`，非常影响阅读。
 *
 * 原则：**只认结构、丢掉属性**。`rowspan=1 colspan=1` 是导出噪声（等于没写），
 * 留着只会让单元格挤成一团；样式一律不进（语料是用户文档，不执行它的样式）。
 * 输入是**已转义**的文本，所以这里认的是 `&lt;td&gt;` 而不是 `<td>`。
 */
function mdInline(s) { return s
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code class="md-code">$1</code>')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '<span class="md-wl">$2</span>')
    .replace(/\[\[([^\]]+)\]\]/g, '<span class="md-wl">$1</span>')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1'); }

function htmlTableToMd(s) {
  const rows = s.match(/&lt;tr[\s\S]*?&lt;\/tr&gt;/gi) || [];
  if (!rows.length) return "";
  let html = '<table class="md-tbl">';
  rows.forEach((row, ri) => {
    const cells = [...row.matchAll(/&lt;t([dh])(?:\s[^&]*?)?&gt;([\s\S]*?)(?=&lt;\/t[dh]&gt;|$)/gi)];
    if (!cells.length) return;
    const tag = ri === 0 ? "th" : "td";
    html += "<tr>" + cells.map(c => {
      const text = c[2].replace(/&lt;br\s*\/?&gt;/gi, " ").replace(/\s+/g, " ").trim();
      return "<" + tag + ">" + mdInline(text) + "</" + tag + ">";
    }).join("") + "</tr>";
  });
  return html + "</table>";
}

function mdRender(html) {
  let src = String(html == null ? "" : html);   // 表格预处理会重写它，故用 let
  // **先把内嵌 HTML 表格抽出来**，用占位符代替，逐行处理完再放回去。
  // 不这么做的话：这种表格通常**一整行**（导出工具不换行），会被当成一个段落，表格结构就没了。
  const tables = [];
  src = src.replace(/&lt;table[\s\S]*?&lt;\/table&gt;/gi, m => {
    tables.push(htmlTableToMd(m));
    return "\u0000T" + (tables.length - 1) + "\u0000";
  });

  const L = src.split(/\r?\n/);
  const out = [];
  let i = 0;
  while (i < L.length) {
    const line = L[i];
    const ph = line.match(/^\u0000T(\d+)\u0000$/);
    if (ph) { out.push(tables[+ph[1]] || ""); i++; continue; }
    // 代码围栏：``` 开头到下一个 ```（围栏本身不显示）
    if (/^\s*```/.test(line)) {
      const buf = [];
      i++;
      while (i < L.length && !/^\s*```/.test(L[i])) { buf.push(L[i]); i++; }
      i++;
      out.push('<pre class="md-pre">' + buf.join("\n") + '</pre>');
      continue;
    }
    // 表格：本行以 | 开头，且下一行是分隔行
    if (/^\s*\|/.test(line) && i + 1 < L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
      const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(s => s.trim());
      let t = '<table class="md-tbl"><thead><tr>' +
        cells(line).map(c => '<th>' + mdInline(c) + '</th>').join("") + '</tr></thead><tbody>';
      i += 2;
      while (i < L.length && /^\s*\|/.test(L[i])) {
        t += '<tr>' + cells(L[i]).map(c => '<td>' + mdInline(c) + '</td>').join("") + '</tr>';
        i++;
      }
      out.push(t + '</tbody></table>');
      continue;
    }
    // 标题：面板里空间小，用"小标题"而不是 h1~h3
    const h = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (h) { out.push('<div class="md-h md-h' + h[1].length + '">' + mdInline(h[2]) + '</div>'); i++; continue; }
    // 分隔线
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { out.push('<hr class="md-hr">'); i++; continue; }
    // 列表（连续的合并成一个 ul/ol）
    const li = line.match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
    if (li) {
      const ordered = /\d/.test(li[1]);
      const items = [];
      while (i < L.length) {
        const m = L[i].match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
        if (!m) break;
        items.push('<li>' + mdInline(m[2]) + '</li>');
        i++;
      }
      out.push((ordered ? '<ol class="md-ul">' : '<ul class="md-ul">') + items.join("") +
               (ordered ? '</ol>' : '</ul>'));
      continue;
    }
    // 引用
    // 引用。**文本已经转义**：`>` 到这里是 `&gt;`，只找 `>` 一条都匹配不到
    // （单元检查抓到过：引用块计数为 0）。两种写法都认。
    const qm = line.match(/^\s*(?:&gt;|>)\s?(.*)$/);
    if (qm) {
      const buf = [qm[1]];
      i++;
      while (i < L.length) {
        const m2 = L[i].match(/^\s*(?:&gt;|>)\s?(.*)$/);
        if (!m2) break;
        buf.push(m2[1]);
        i++;
      }
      out.push('<div class="md-q">' + mdInline(buf.join(" ")) + '</div>');
      continue;
    }
    if (!line.trim()) { i++; continue; }
    out.push('<p class="md-p">' + mdInline(line) + '</p>');
    i++;
  }
  return out.join("");
}

/** 展示用：转义 + 标关键词 + 渲染 Markdown。展示片段一律走这个。 */
function mdTerms(text, terms) {
  return mdRender(markTerms(text, terms));
}


function markTerms(text, terms) {
  let h = esc(text);
  (terms || []).filter(Boolean).sort((a, b) => b.length - a.length).forEach(t => {
    h = h.split(esc(t)).join(`<mark>${esc(t)}</mark>`);
  });
  return h;
}

// ── 详情：点击关键词/线索后的佐证面板 ───────────────────────────────
async function openDetail(c) {
  S.detailFor = c.id;
  $("#detail").style.display = "";
  $("#d-title").textContent = c.meta.label + " · 佐证";
  $("#d-body").innerHTML = '<div class="empty">加载中…</div>';
  renderClues();
  try {
    let d;
    if (String(c.id).indexOf("term:") === 0) {
      // 点关键词且**没有对应线索记录**时，前端造了个 `term:xxx` 临时对象走同一条
      // 渲染路径；但服务端没有这条记录，`/api/clue` 必然 404 —— 用户看到的
      // 就是"加载失败：clue not found"。改走 `/api/refine`：同一份语料证据，
      // 只是没有线索元数据（来源发言本地就有，见下面的 _seg）。
      const rr = await (await fetch(
        "/api/refine?term=" + encodeURIComponent(c.anchor || ""))).json();
      if (rr.error) throw new Error(rr.error);
      d = { segment: c._seg || null, refs: rr.results || [], related: [] };
    } else {
      const r = await fetch("/api/clue?id=" + encodeURIComponent(c.id));
      d = await r.json();
      if (d.error) throw new Error(d.error);
    }
    const b = $("#d-body");
    b.textContent = "";
    if (d.segment) {
      const sec = el("div", "d-sec");
      sec.appendChild(el("div", "d-label", "来源发言 · " + fmtT(d.segment.start) +
        (d.segment.speaker ? " · " + d.segment.speaker : "")));
      const q = el("div", "d-quote");
      q.innerHTML = mdTerms(d.segment.text, [c.anchor]);
      sec.appendChild(q);
      b.appendChild(sec);
    }
    if (d.refs && d.refs.length) {
      const sec = el("div", "d-sec");
      sec.appendChild(el("div", "d-label", "资料依据 · 可拖到「我的发言计划」当参考"));
      for (const ref of d.refs) {
        const card = el("div", "ref");
        // 可拖 + 一键钉，两种方式做同一件事：拖适合"我知道要放到哪条"，
        // 按钮适合"先收着"。都保留，因为两种时机都会发生。
        card.dataset.ref = JSON.stringify(ref);
        const h = el("div", "ref-h");
        h.appendChild(el("span", "ref-t", ref.title));
        if (ref.label) h.appendChild(el("span", "ref-l", ref.label));
        h.appendChild(el("span", "ref-s", "相关度 " + (ref.score != null ? ref.score : "—")));
        const pin = el("button", "ref-pin", "钉为参考");
        pin.title = "加入「我的发言计划」。会附到当前选中的那条上；没选中则新建一条。";
        pin.onclick = async ev => {
          ev.stopPropagation();
          const target = S.prep.some(p => p.id === S.selPlanId) ? S.selPlanId : "";
          const r = await prepAction("attach_ref", { id: target, ref });
          if (r.error) { toast(r.error, 3000); return; }
          S.notesHidden = false;
          const it = S.prep.find(p => p.id === (r.item || {}).id);
          toast(r.created
            ? `已新建计划项并附上参考`
            : `已钉到「${(it ? it.topic : "").slice(0, 12)}」当参考`, 3000);
          tick();
        };
        h.appendChild(pin);
        card.appendChild(h);
        const x = el("div", "ref-x");
        x.innerHTML = mdTerms(ref.snippet || "", [c.anchor, c.actor, c.due]);
        card.appendChild(x);
        sec.appendChild(card);
      }
      b.appendChild(sec);
    } else {
      const sec = el("div", "d-sec");
      sec.appendChild(el("div", "d-label", "资料依据"));
      sec.appendChild(el("div", "hint", "资料库里没有直接匹配的条目。"));
      b.appendChild(sec);
    }
    if (d.related && d.related.length) {
      const sec = el("div", "d-sec");
      sec.appendChild(el("div", "d-label", "同类线索"));
      for (const rel of d.related) {
        const card = el("div", "ref");
        card.style.cursor = "pointer";
        card.innerHTML = `<div class="ref-h"><span class="ref-t">${esc(rel.meta.label)}</span>` +
          `<span class="ref-s">${fmtT(rel.t)}</span></div>` +
          `<div class="ref-x">${esc(rel.text)}</div>`;
        card.onclick = ev => { ev.stopPropagation(); openDetail(rel); };
        sec.appendChild(card);
      }
      b.appendChild(sec);
    }
  } catch (e) {
    $("#d-body").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

// ── 悬浮卡：关键词摘要 ──────────────────────────────────────────────
let hoverTimer = null, hoverTerm = null, refineCache = new Map();
const pop = $("#pop");

/** 统一的收起入口。
 *
 * 为什么要专门做一个函数：原来 `mouseout` 只取消了"**还没显示**"的定时器，
 * 而**已经显示的框没人管**——于是它一直挂在屏幕上，直到鼠标划到另一个热词
 * 才被替换掉（用户报的就是这个）。收起逻辑散在三处（mouseout / scroll / Esc）
 * 时这类漏掉一个分支的 bug 很容易再犯，所以收拢成一个入口。
 */
function hidePop() {
  clearTimeout(hoverTimer);
  hoverTerm = null;
  pop.style.display = "none";
  document.querySelectorAll(".kw.on").forEach(x => x.classList.remove("on"));
}

document.addEventListener("mouseover", e => {
  const k = e.target.closest && e.target.closest(".kw");
  if (!k || k === hoverTerm) return;
  clearTimeout(hoverTimer);
  const term = k.dataset.term;
  hoverTimer = setTimeout(() => showPop(k, term), 130);   // 划过不算
});
document.addEventListener("mouseout", e => {
  const k = e.target.closest && e.target.closest(".kw");
  if (!k) return;
  // 只是在这个热词**内部**移动（比如从 <mark> 挪到相邻文本节点）不算离开。
  // 不加这一条会闪：mouseout 会从子元素冒泡上来，框刚显示就被收掉。
  if (e.relatedTarget && k.contains(e.relatedTarget)) return;
  hidePop();                       // ← 缺的就是这一句
});
document.addEventListener("scroll", hidePop, true);
// 鼠标移出整个窗口也要收（否则框会留在屏幕上，看着像卡住了）
document.addEventListener("mouseleave", hidePop);

/** hover 的内容：**出处 + 原文**，不做任何加工。
 *
 * 用户的要求：hover 给"没有任何加工处理的信息，最好只包含内容来源和简单上下文"。
 * 所以这里刻意**不显示**：耗时（`12 ms` 是机器噪声，不是信息）、相关性得分、任何
 * 机器写的概括。只给：哪份文件的哪一节（出处），以及那一处的**逐字原文**。
 *
 * 两级分工：hover 回答"这话从哪来"——必须是原文，让用户自己判断；
 * click 回答"这话意味着什么"——加工放在那边（右栏证据包）。
 *
 * 按**文件**分组：同一文件命中三处时文件只写一次，下面列三节——读起来像
 * "引自哪份文档的哪几节"，而不是三条互不相干的搜索结果。
 */
function renderRefine(term, d) {
  const rs = (d && d.results) || [];
  const head = `<div class="ph"><span class="pt">「${esc(term)}」</span></div>`;
  if (!rs.length) {
    return head + '<div class="hint" style="padding:4px 0">资料库里没有匹配条目</div>' +
      `<div class="pfoot">点击关键词查看完整佐证</div>`;
  }
  const byFile = new Map();
  for (const r of rs) {
    const k = r.rel || r.title || "?";
    if (!byFile.has(k)) {
      byFile.set(k, { rel: r.rel || "", title: r.title || k, label: r.label || "", hits: [] });
    }
    byFile.get(k).hits.push(r);
  }
  let html = head;
  for (const [, f] of byFile) {
    // 章节面包屑："A > B > C" 取末两级并用 › 连接——够定位，不啰嗦
    const parts = String(f.hits[0].heading || "").split(">").map(s => s.trim()).filter(Boolean);
    const crumb = parts.slice(-2).join(" › ");
    html += `<div class="prow">
      <div class="psrc">${esc(f.rel || f.title)}${f.label ? ` <span class="plab">${esc(f.label)}</span>` : ""}</div>
      ${crumb ? `<div class="pcrumb">${esc(crumb)}</div>` : ""}`;
    for (const h of f.hits) {
      html += `<div class="pq">${mdTerms(h.snippet || "", [term])}</div>`;
    }
    html += `</div>`;
  }
  return html + `<div class="pfoot">点击关键词查看完整佐证</div>`;
}

async function showPop(anchorEl, term) {
  hoverTerm = anchorEl;
  document.querySelectorAll(".kw.on").forEach(x => x.classList.remove("on"));
  anchorEl.classList.add("on");
  pop.style.display = "block";
  pop.innerHTML = `<div class="ph"><span class="pt">「${esc(term)}」</span>
    <span class="pm">检索中…</span></div>`;
  position(anchorEl);
  let d = refineCache.get(term);
  if (!d) {
    try {
      d = await (await fetch("/api/refine?term=" + encodeURIComponent(term))).json();
      refineCache.set(term, d);
    } catch (e) { d = { results: [], elapsed_ms: 0 }; }
  }
  if (hoverTerm !== anchorEl) return;      // 鼠标已经移开了，别把卡片画上去
  pop.innerHTML = renderRefine(term, d);
  position(anchorEl);
}

function position(a) {
  const r = a.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.left - 10, innerWidth - w - 12);
  let top = r.bottom + 8;
  if (top + h > innerHeight - 10) top = Math.max(10, r.top - h - 8);
  pop.style.left = Math.max(10, left) + "px";
  pop.style.top = top + "px";
}

let sSel = 0, sRows = [];
function openSearch() {
  $("#search").classList.add("on");
  $("#s-in").value = ""; $("#s-in").focus();
  $("#s-res").innerHTML = "";
  sRows = []; sSel = 0;
}
function closeSearch() { $("#search").classList.remove("on"); }
$("#btn-search").onclick = openSearch;
$("#search").onclick = e => { if (e.target.id === "search") closeSearch(); };

let sTimer = null;
$("#s-in").addEventListener("input", () => {
  clearTimeout(sTimer);
  sTimer = setTimeout(runSearch, 180);
});
$("#s-in").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sSel = Math.min(sSel + 1, sRows.length - 1); paintSearch(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sSel = Math.max(sSel - 1, 0); paintSearch(); e.preventDefault(); }
  if (e.key === "Enter") { gotoResult(); }
  if (e.key === "Escape") { closeSearch(); }
});

async function runSearch() {
  const q = $("#s-in").value.trim();
  if (!q) { $("#s-res").innerHTML = ""; sRows = []; return; }
  const d = await (await fetch("/api/search?q=" + encodeURIComponent(q))).json();
  sRows = [];
  for (const s of (d.segments || []))
    sRows.push({ kind: "发言", title: fmtT(s.start), text: s.text, idx: s.idx });
  for (const r of (d.corpus || []))
    sRows.push({ kind: r.label || "资料", title: r.title, text: r.snippet, clue: null });
  sSel = 0;
  paintSearch(q);
}

function paintSearch(q) {
  const box = $("#s-res");
  if (!sRows.length) {
    box.innerHTML = '<div class="empty" style="padding:20px">没有匹配</div>';
    return;
  }
  box.textContent = "";
  sRows.forEach((r, i) => {
    const row = el("div", "s-row" + (i === sSel ? " on" : ""));
    const t = el("div", "s-rt", r.kind + " · " + r.title);
    const x = el("div", "s-rx");
    x.innerHTML = mdTerms(r.text || "", q ? [q] : []);
    row.append(t, x);
    row.onclick = () => { sSel = i; gotoResult(); };
    box.appendChild(row);
  });
  box.querySelector(".s-row.on")?.scrollIntoView({ block: "nearest" });
}

function gotoResult() {
  const r = sRows[sSel];
  if (!r) return;
  closeSearch();
  if (r.idx != null && S.segByIdx.has(r.idx)) {
    S.follow = false;
    selectSeg(r.idx, true);
    const n = $(`#feed .utt[data-idx="${r.idx}"]`);
    if (n) { n.style.transition = "background .1s"; n.style.background = "var(--accent-soft)";
      setTimeout(() => { n.style.background = ""; }, 1100); }
  } else {
    toast(r.kind + "：" + r.title);
  }
}

// 强调环加在目标控件上。不用"挖一个高亮洞"：洞要跟着布局算坐标，窗口一缩、
// 栏一折叠就跑到别处去了；而 outline 不参与布局，加在哪都只是画一圈线。

  for (const node of document.querySelectorAll(".g-hl")) node.classList.remove("g-hl");
  if (!sel) return;

  if (!node) return;
  node.classList.add("g-hl");

}

// ── 键盘 ────────────────────────────────────────────────────────────
// 全部用组合键（Alt / Ctrl），因为单键会和"在输入框里打字"抢字符。
// 第一版用 j/k// 这些单键，结果用户在「我的发言计划」输入框里打一条内容时，
// 每个字符都可能触发命令——尤其 `/`：它的判断写在 typing 守卫之前就先
// preventDefault() 了，所以打斜杠必然弹出搜索框，连字都打不进去。
// 组合键把"打字"和"命令"这两件事在物理上分开，不再依赖守卫是否写对。
function isTyping(el) {
  if (!el) return false;
  const tag = (el.tagName || "").toUpperCase();
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT"
    || el.isContentEditable === true;
}

document.addEventListener("keydown", e => {
  const typing = isTyping(e.target);

  // Esc 与是否在输入框无关：先离开输入、再关弹层、再取消选择。
  if (e.key === "Escape") {
    // 覆盖层比输入框更"外面"：设置面板里按 Esc 应该关面板，
    // 而不是只把焦点从输入框上拿开、把面板留在原地。
    // 引导在最上层，所以它先接 Esc：否则第一次打开时按 Esc 会去关别的层，
    // 而用户眼前明明盖着引导。
    if ($("#guide").classList.contains("on")) { closeGuide(); return; }
    if ($("#imp").classList.contains("on")) { closeImport(); return; }
    if ($("#settings").classList.contains("on")) { closeSettings(); return; }
    if ($("#search").classList.contains("on")) { closeSearch(); return; }
    if (typing) { e.target.blur(); return; }
    hidePop();
    if ($("#detail").style.display !== "none") { $("#d-close").onclick(); return; }
    S.curSpeaker = null;
    renderPeople();
    return;
  }

  // 输入框里的普通按键一律不管——这是硬保证，不是"尽量"。
  if (typing) return;

  const mod = e.ctrlKey || e.metaKey;
  const alt = e.altKey;

  // 面板开合在输入框外也用单键，因为它不产生字符，不会和打字冲突。
  if (!mod && !alt) {
    if (e.key === "1") { $("#btn-left").onclick(); return; }
    if (e.key === "2") { $("#btn-right").onclick(); return; }
    if (e.key === "?" ) { showKeys(); return; }
  }

  if (alt && e.key.toLowerCase() === "j") { stepSeg(1); e.preventDefault(); return; }
  if (alt && e.key.toLowerCase() === "k") { stepSeg(-1); e.preventDefault(); return; }
  if (alt && e.key.toLowerCase() === "g") { S.follow = true; scrollFeed(); return; }
  if (alt && e.key.toLowerCase() === "p") { toggleNotes(); return; }
  if (alt && e.key.toLowerCase() === "l") { $("#pp-input").focus(); return; }
  if (mod && e.key.toLowerCase() === "k") {
    e.preventDefault(); openSearch(); return;              // 搜索：Ctrl/Cmd+K
  }
  if (mod && e.key === ",") {
    // Ctrl+, 是各家软件的设置快捷键，不产生字符也不会误触浏览器
    e.preventDefault(); openSettings(); return;
  }
  if (mod && e.key.toLowerCase() === "e") {
    e.preventDefault(); window.open("/api/transcript", "_blank"); return;
  }
  if (mod && e.key.toLowerCase() === "s") {
    // Ctrl+S 落成"置顶当前发言的第一条线索"，顺手且不会误触浏览器保存
    e.preventDefault();
    const seg = S.segByIdx.get(S.selected);
    const c = seg ? S.clues.find(x => x.seg_id === seg.id) : null;
    if (!c) { toast("当前发言没有线索"); return; }
    fetch("/api/clue", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: c.id, pinned: !c.pinned }) }).then(() => {
      toast(c.pinned ? "已取消置顶" : "已置顶"); tick(); });
    return;
  }
});

function showKeys() {
  toast("Alt+J/K 上下句 · Alt+G 到底 · Alt+P 便签 · Alt+L 写要点 · Ctrl+K 搜索 · " +
        "Ctrl+, 设置 · Ctrl+S 置顶线索 · Ctrl+E 导出 · 1/2 折叠栏 · Esc 取消" +
        "（完整的使用引导：设置 → 界面）", 6000);
}

function stepSeg(dir) {
  const idxs = [...S.segByIdx.values()].sort((a, b) => a.start - b.start).map(s => s.idx);
  if (!idxs.length) return;
  let i = idxs.indexOf(S.selected);
  i = i < 0 ? (dir > 0 ? 0 : idxs.length - 1)
            : Math.max(0, Math.min(idxs.length - 1, i + dir));
  S.follow = i === idxs.length - 1;
  selectSeg(idxs[i], true);
}

function toggleNotes() {
  S.notesHidden = !S.notesHidden;
  $("#notes-layer").classList.toggle("hidden", S.notesHidden);
  $("#btn-notes").textContent = S.notesHidden ? "便签" : "便签 ✓";
  // 关掉便签就把整栏宽度还给发言流。忘了这一步会出现"便签没了、右边空一大块"。
  applyNoteLane();
}

// ── 主题 ────────────────────────────────────────────────────────────
// 只有两个主题，切换就是把 data-theme 换掉——所有颜色都走 CSS 变量，
// 所以没有任何组件需要知道当前主题，也没有一处需要 JS 改颜色。
// 暗色是主打；亮色保留。选择记在 localStorage，下次打开保持。
function currentTheme() {
  return document.documentElement.getAttribute("data-theme") || "dark";
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const b = $("#btn-theme");
  if (b) {
    // 按钮显示的是"切过去会变成什么"还是"当前是什么"，这两种都有人用；
    // 这里显示目标（点一下会到哪），并在 title 里说清当前状态。
    b.textContent = theme === "dark" ? "亮色" : "暗色";
    b.title = "当前：" + (theme === "dark" ? "暗色" : "亮色") + "，点击切换";
  }
  try {
    localStorage.setItem("plaud-theme", theme);
  } catch (e) { /* 隐私模式：不记忆，本次会话内仍然生效 */ }
}

$("#btn-theme").onclick = () => {
  applyTheme(currentTheme() === "dark" ? "light" : "dark");
};

// 跟随系统只在用户没手动选过时生效——手动选过就该一直听用户的。
try {
  if (!localStorage.getItem("plaud-theme") &&
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches) {
    applyTheme("light");
  }
} catch (e) { /* 同上 */ }
applyTheme(currentTheme());

// ── 启动 ────────────────────────────────────────────────────────────
// 启动失败必须在页面上看得见。第一版只是 console.error，于是"接口 404 / 服务没起 /
// JS 报错"这一整类故障在用户眼里都只是"页面没有反应"——用户报"显示错误"时，
// 我这边只能靠无头浏览器猜。现在任何启动异常都会把原因直接印在页面上。
function bootFail(what, err) {
  const box = document.getElementById("boot-error");
  if (!box) return;
  box.style.display = "block";
  box.textContent = "启动/连接失败：" + what + " — " + (err && err.message ? err.message : err) +
    "\n\n界面每 0.4 秒会自动重试；若一直不通，看启动器窗口里的日志" +
    "（data/launcher/backend.log），或确认 python -m meeting.server 在运行。" +
    "\n当前地址：" + location.href;
}

// 短暂连不上不等于坏了：重启服务、加载大模型时都会这样。这时给一句中性提示，
// 别说成"失败"——恢复之后它会自己消失（tick 成功就隐藏）。
function bootWait(n) {
  const box = document.getElementById("boot-error");
  if (!box) return;
  box.style.display = "block";
  box.textContent = "服务暂时不可用（可能正在重启 / 加载模型）——界面会自动重连，不用管。\n"
    + "第 " + n + " 次未连上 · " + location.href;
}

async function boot() {
  try {
    await tick();
  startStream();   // 首帧之后开推送（推送只管增量，首帧仍然要拉）
  // 引导放在首帧之后：盖在一片空态上的引导只会让人以为界面是空的。
  // 只在这里调一次——轮询里不调，否则用户关掉它之后每秒都会被重新弹出来。
  maybeShowGuide();
  } catch (e) {
    bootFail("首次读取会话失败", e);
  }
  // 轮询一直失败也要浮出来，而不是让界面永远停在初始空态
  let fails = 0;
  setInterval(async () => {
    try {
      await tick();
      fails = 0;
      const box = document.getElementById("boot-error");
      if (box) box.style.display = "none";
    } catch (e) {
      fails++;
      // 短暂断连（重启服务 / 加载模型）说成"暂时不可用"，别说成失败；
      // 连续十几秒都不通才升级成真错误。
      if (fails >= 25) bootFail("连续 " + fails + " 次读取会话失败", e);
      else if (fails >= 3) bootWait(fails);
    }
  }, 400);
}
window.addEventListener("error", ev => bootFail("脚本异常", ev.message || ev.error));
window.addEventListener("unhandledrejection", ev => bootFail("未处理的异步异常", ev.reason));
boot();

</script>
</body>
</html>
