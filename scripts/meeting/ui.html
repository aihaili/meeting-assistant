<!DOCTYPE html>
<!-- saved from url=(0022)http://127.0.0.1:8510/ -->
<html lang="zh-CN" data-theme="dark" data-darkreader-proxy-injected="true"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时会议助理</title>
<!-- 主题必须在首帧之前定下来。放在 <head> 里同步执行：如果等 </body> 前的脚本才跑，
     浏览器已经按亮色画过一帧，暗色用户会看到一次白闪。localStorage 在隐私模式下
     可能抛异常，所以整段包在 try 里，并回落到暗色（当前主打的主题）。 -->
<script>
(function () {
  var theme = "dark";
  try {
    theme = localStorage.getItem("plaud-theme") || "dark";
  } catch (e) { /* 隐私模式：用默认值 */ }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<!-- 内联 favicon：不加这一行浏览器会请求 /favicon.ico 拿到 404，审计里就是一条
     控制台错误。一个 200 字节的 data URI 换一个干净的控制台，划算。 -->
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' rx='4' fill='%231f5fd0'/&gt;&lt;path d='M4 8h8M8 4v8' stroke='white' stroke-width='1.6' stroke-linecap='round'/&gt;&lt;/svg&gt;">
<style>
/* ============================================================================
   设计系统
   ----------------------------------------------------------------------------
   底色用暖调白而不是纯白：整场会议要盯着看两小时，纯白在 LCD 上偏刺眼。
   层次靠三层 surfaces + 发丝级边框表达，不靠阴影堆叠——阴影在密集列表里
   会变成视觉噪音。强调色只给"需要动作"的东西，正文永远是中性色。
   ============================================================================ */
:root{
  color-scheme: light;

  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#f1f3f6;
  --surface-3:#e8ebf0;
  --line:#e2e6ec;
  --line-strong:#cdd4de;
  --text:#111827;
  --text-2:#4b5563;      /* 次要正文：7.05:1 on page */
  --text-3:#5f6878;      /* 小字/时间戳：5.24:1 —— 审计发现原 #8a93a3 只有 2.89:1，
                            在会议室投影上等于看不见。这个值由 pick_contrast.py
                            算出来，是同时在三种底色上通过 AA 的档位。 */
  --text-4:#7d8694;      /* 纯装饰（分隔、位置已表意的提示）：3.43:1 */
  --accent:#1f5fd0;
  --accent-hi:#1a52b8;   /* 悬停/按下 */
  --accent-soft:#eaf0fd;
  --accent-line:#bcd0f5;
  /* 强调色上的文字。暗色下强调色更亮，所以这个必须跟着主题变——
     写死 #fff 会在暗色的浅蓝按钮上变成白底白字。 */
  --on-accent:#ffffff;

  /* 便签。亮色下是暖米色"纸"；暗色下不能沿用米色（它在深背景上像一块高亮），
     所以单独令牌化，两种主题各自取值。 */
  --note-bg:#fffdf6;
  --note-bg-done:#f6f8f6;
  --note-line:#ece4cf;
  --note-line-done:#dfe6df;
  --note-inner:#ffffff;
  --note-inner-line:#e8e4d8;
  --note-quote:#e8e0cc;

  /* 浮层与交互态 */
  --hover-veil:rgba(255,255,255,.7);
  --btn-hover-line:#b9c1cd;
  --scroll-thumb:#d3d9e2;
  --scroll-thumb-hi:#b9c1cd;
  --ok:#16a34a;
  --ok-soft:rgba(22,163,74,.16);
  /* "成功"的**文字**色单独一支。--ok 是给图标和描边用的，直接拿去写字在亮色下
     只有 2.98:1（#16a34a 落在 #f1f3f6 上）——绿色在白底上天生吃亏，靠"看着还行"
     判断不出来，所以暗色也一并给值，两边都用同一个语义位。 */
  --ok-ink:#0c6b30;

  /* 阴影。暗色下黑色阴影在深背景上几乎不可见，需要更深的黑和更大不透明度，
     否则卡片"浮"不起来、层次整个消失——所以阴影也必须令牌化。 */
  --shadow-1:0 1px 3px rgba(17,24,39,.07);
  --shadow-2:0 1px 2px rgba(17,24,39,.05),0 8px 20px -10px rgba(17,24,39,.22);
  --shadow-3:0 2px 4px rgba(17,24,39,.06),0 14px 30px -12px rgba(17,24,39,.3);
  --shadow-accent:0 0 0 3px var(--accent-soft),0 14px 30px -12px rgba(17,24,39,.3);
  --shadow-ghost:0 8px 20px -6px rgba(0,0,0,.4);
  --shadow-pop:0 12px 32px -8px rgba(17,24,39,.22),0 2px 6px rgba(17,24,39,.06);

  /* 语义色都按"在自身浅底上 ≥4.5:1"重新定过。原值里 requirement 的 #c2410c
     在 #fdf1e7 上只有 4.0:1，term 的 #475569 在 #eef1f5 上 3.9:1，都在小字号
     下不达标。 */
  --req:#a63a09;   --req-bg:#fdf1e7;   --req-line:#f2d3ba;
  --com:#0d6a63;   --com-bg:#e6f4f2;   --com-line:#b8e0da;
  --date:#8a5306;  --date-bg:#fbf4e3;  --date-line:#eddfb6;
  --risk:#a51a1a;  --risk-bg:#fdeceb;  --risk-line:#f3c9c6;
  --agr:#6023c4;   --agr-bg:#f2ecfd;   --agr-line:#dccdf7;
  --clause:#1a45c2;--clause-bg:#eaf0fd;--clause-line:#c6d8f7;
  --dec:#0369a1;   --dec-bg:#e8f3fa;   --dec-line:#c2e0f0;
  --term:#3f4a5a;  --term-bg:#eef1f5;  --term-line:#d6dce4;
  --who:#a3144e;   --who-bg:#fdeef4;   --who-line:#f4cddd;
  --org:#0b6076;   --org-bg:#e7f4f7;   --org-line:#c1e2e9;

  --radius:10px;
  --radius-sm:7px;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:"HarmonyOS Sans SC","HarmonyOS_Sans_SC","PingFang SC","Microsoft YaHei",
         "Segoe UI",system-ui,-apple-system,sans-serif;
}

/* ── 暗色主题 ──────────────────────────────────────────────────────── */
/* 暗色不是把亮色反相。三个刻意的决定：

   ① 底色用**冷灰**而不是纯黑。纯黑在 LCD 上与卡片的明度差过硬，长时间看疲劳，
      而且会让所有阴影彻底失效（黑投在黑上）。用 #0f1216 打底、卡片 #171b21，
      层次靠明度差而不是阴影。
   ② 正文不用纯白。纯白在暗底上有明显光晕（halation），中文细笔画尤其糊。
      用 #e8ebf1（对底色 14.6:1），远高于 AA 又不刺眼。
   ③ 语义色全部**提亮**。亮色下的 #a63a09 在深底上只有约 2.1:1，等于看不见。
      每一类的前景色单独调亮、底色改成低饱和深色调，保住"同类同色"的辨识度。

   这些值由 audit_ui.js 在暗色下自动跑一遍对比度检查来验证，不是凭感觉定的。 */
:root[data-theme="dark"]{
  color-scheme: dark;

  --bg:#0f1216;
  --surface:#171b21;
  --surface-2:#1e232b;
  --surface-3:#262c35;
  --line:#2a3139;
  --line-strong:#3a424d;
  --text:#e8ebf1;
  --text-2:#b6bfcc;
  --text-3:#98a2b0;
  --text-4:#78828f;
  --accent:#5b9bff;
  --accent-hi:#7cb0ff;
  --accent-soft:#152238;
  --accent-line:#2b4a7d;
  --on-accent:#0b1220;

  --note-bg:#20242b;
  --note-bg-done:#1b1f24;
  --note-line:#333a44;
  --note-line-done:#2c333c;
  --note-inner:#191d23;
  --note-inner-line:#313842;
  --note-quote:#39414c;

  --hover-veil:rgba(255,255,255,.035);
  --btn-hover-line:#4a535f;
  --scroll-thumb:#333b45;
  --scroll-thumb-hi:#454e5a;
  --ok:#4ade80;
  --ok-soft:rgba(74,222,128,.18);
  --ok-ink:#4ade80;

  --shadow-1:0 1px 3px rgba(0,0,0,.5);
  --shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.7);
  --shadow-3:0 2px 4px rgba(0,0,0,.45),0 14px 30px -12px rgba(0,0,0,.8);
  --shadow-accent:0 0 0 3px var(--accent-soft),0 14px 30px -12px rgba(0,0,0,.8);
  --shadow-ghost:0 8px 20px -6px rgba(0,0,0,.75);
  --shadow-pop:0 12px 32px -8px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.5);

  --req:#f2a377;   --req-bg:#33231a;   --req-line:#5a3a28;
  --com:#5fd4c3;   --com-bg:#122b28;   --com-line:#27544e;
  --date:#e8c069;  --date-bg:#2e2716;  --date-line:#54492a;
  --risk:#f28b8b;  --risk-bg:#331b1b;  --risk-line:#5c3232;
  --agr:#c0a6fb;   --agr-bg:#241b38;   --agr-line:#463464;
  --clause:#8fb4ff;--clause-bg:#182640;--clause-line:#2f4a78;
  --dec:#7cc4ee;   --dec-bg:#14262f;   --dec-line:#28485a;
  --term:#a7b3c2;  --term-bg:#1f242b;  --term-line:#39424e;
  --who:#f2a0c0;   --who-bg:#331b26;   --who-line:#5c3245;
  --org:#7fd0e8;   --org-bg:#122a31;   --org-line:#26505e;
}

/* 这一行的位置很要紧：它必须是一个完整的、独立的顶层规则。
   之前这里多了一个 }，于是 CSS 解析器把 "} *" 当成了一条选择器的前奏，
   和后面的 {box-sizing:border-box} 合成一条**非法规则整体丢弃**——
   后果不是"少一条样式"，而是全站所有 width:100% + padding 的输入框都多出
   22px（7px 上下内边距 + 1px 边框各算两份），面板被撑出横向滚动条。
   靠肉眼看是发现不了的：控件看着只是"稍微宽了一点"。 */
*{box-sizing:border-box}
html,body{height:100%}
/* 整页用 flex 纵向排布，而不是给 main 写 height:calc(100vh - 52px)。
   顶栏在窄屏会换行到 80–90px 高，写死的 52px 会让页面比视口高出一截。
   交给 flex 算，顶栏多高都不影响。 */
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);
  font-size:14px;line-height:1.65;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-soft)}

/* 滚动条：细、无轨道、只有拖动时才明显 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hi);border:2px solid transparent;
  background-clip:content-box}

/* ── 顶栏 ─────────────────────────────────────────────────────────── */
header{
  min-height:52px;display:flex;align-items:center;gap:14px;
  padding:6px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  /* 顶栏里全是 nowrap 的小块，不能收缩也不能换行时会整体撑破页面——审计在
     820px 上量到 header scrollWidth 855px。允许换行并让各块可以收缩。 */
  flex-wrap:wrap;row-gap:6px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14.5px;
       letter-spacing:-.01em;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none;
     transition:background .3s}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);
          animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.meeting-title{
  font-weight:500;color:var(--text-2);font-size:13.5px;border:0;background:none;
  font-family:inherit;padding:4px 8px;border-radius:var(--radius-sm);
  min-width:60px;flex:0 1 auto;width:220px;
  text-overflow:ellipsis;
}
.meeting-title:hover{background:var(--surface-2)}
.meeting-title:focus{outline:2px solid var(--accent-line);background:var(--surface)}

.spacer{flex:1 1 auto;min-width:0}
.stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);
      white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden}
.stat b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{color:var(--text-4)}
.sep{width:1px;height:20px;background:var(--line);flex:none}

/* 按钮图标 */
.btn>svg{flex:0 0 auto;margin-right:5px}
.btn{

  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  padding:6px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);
  transition:background .13s,border-color .13s,color .13s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--btn-hover-line);color:var(--text)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:#1a52b8;border-color:#1a52b8;color:var(--on-accent)}
/* ghost 按钮原本把边框设成透明（无描边）。用户要求"像 Ctrl K 那个框一样有描边"，
   所以这里用**和 kbd 同一个变量** var(--line-strong)——不新造一种边框色，
   否则界面上会出现两种"看起来差不多但不一样"的框。
   底边不加粗（kbd 的 2px 是键帽的隐喻，用在按钮上会显得按钮像被压住）。 */
.btn.ghost{border-color:var(--line-strong);background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .kbd{margin-left:2px}
kbd{
  font-family:var(--mono);font-size:10.5px;line-height:1.5;padding:1px 4px;
  border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;
  background:var(--surface-2);color:var(--text-3);
}
/* ── 三栏 ─────────────────────────────────────────────────────────── */
/* 用 minmax(x, x) 固定侧栏、minmax(0,1fr) 让中栏吃掉剩余宽度。纯固定值 +
   百分比会在某些宽度下把网格撑破，而 1fr 的最小值默认是 auto——中栏里的
   长发言会让整个网格横向溢出。minmax(0,1fr) 才是"可以缩到 0"的意思。 */
main{
  display:grid;grid-template-columns:264px minmax(0,1fr) 420px;
  flex:1 1 auto;min-height:0;
  transition:grid-template-columns .22s cubic-bezier(.4,0,.2,1);
}
main.hide-left{grid-template-columns:0 minmax(0,1fr) 420px}
main.hide-right{grid-template-columns:264px minmax(0,1fr) 0}
main.hide-left.hide-right{grid-template-columns:0 minmax(0,1fr) 0}

/* 折叠时整个栏位一起从布局里移除。先试的是 visibility:hidden —— 审计证明它不够：
   栏宽塌到 1px 时内容仍然是布局的一部分，.col-body 的 16px 内边距照样把
   scrollWidth 撑到 82px，于是"折叠"反而制造了横向溢出。
   display:none 才真的把内容拿掉（也因此不再需要 pointer-events 那一套）。 */
main.hide-left #col-left,main.hide-right #col-right{
  display:none;
}

.col{overflow:hidden;display:flex;flex-direction:column;min-width:0}
/* 便签层绝对定位在发言流上方，所以中栏必须是定位上下文 */
.col.mid{position:relative}
/* 显式占用网格列。不写这三行的话，折叠掉某一栏（display:none）会让中栏被自动
   放置到第一个网格列里——那是一个 0 宽的空列，于是中栏在窄屏上被压成 224px。
   审计在 1000px/820px 上抓到过这个：中栏宽度 224px，而不是剩下的全部。 */
#col-left{grid-column:1}
#col-mid{grid-column:2}
#col-right{grid-column:3}
.col.left{border-right:1px solid var(--line);background:var(--surface)}
.col.right{border-left:1px solid var(--line);background:var(--surface)}
.col.mid{background:var(--bg)}

.col-head{
  flex:none;padding:13px 14px 10px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);
}
.col-head h2{
  margin:0;font-size:11.5px;font-weight:650;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-3);white-space:nowrap;
}
.col-head .count{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-3);
  background:var(--surface-2);border-radius:20px;padding:1px 7px;
}
.col-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px}
.col-body.tight{padding:8px}

/* ── 左栏：参会人员 ───────────────────────────────────────────────── */
.person{
  display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background .12s;position:relative;
}
.person:hover{background:var(--surface-2)}
.person.active{background:var(--accent-soft)}
.person.active::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;
  border-radius:2px;background:var(--accent);
}
.avatar{
  width:28px;height:28px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:650;color:var(--on-accent);letter-spacing:-.02em;
  transition:box-shadow .2s;
}
.person.speaking .avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 4px currentColor}
.person.speaking{background:var(--accent-soft)}
.p-meta{min-width:0;flex:1}
.p-name{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis}
.p-sub{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.voice-chip{
  font-size:10px;padding:0 5px;border-radius:4px;line-height:15px;flex:none;
  border:1px solid var(--line-strong);color:var(--text-3);background:var(--surface-2);
}
.voice-chip.on{border-color:var(--com-line);background:var(--com-bg);color:var(--com)}
.person .rm{
  opacity:0;border:0;background:none;color:var(--text-3);cursor:pointer;
  font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;flex:none;
}
.person:hover .rm{opacity:1}
.person .rm:hover{background:var(--risk-bg);color:var(--risk)}

.add-row{display:flex;gap:6px;padding:8px 4px 2px}
.add-row input{
  flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 9px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text);
}
.add-row input:focus{outline:none;border-color:var(--accent-line);
                     background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}

/* ── 会议流程 / 我的发言计划 ──────────────────────────────────────── */
/* 两块并排而不是叠放：它们方向相反，并排才能一眼看出"主持人要讲的"和
   "我要讲的"是否对得上。空间不够时允许换行，不压缩字号。 */
.planbar{
  flex:none;display:flex;flex-wrap:wrap;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.plan{flex:1 1 300px;min-width:0;display:flex;flex-direction:column}
.plan + .plan{border-left:1px solid var(--line)}
@media (max-width:900px){ .plan + .plan{border-left:0;border-top:1px solid var(--line)} }
.pl-head{
  display:flex;align-items:center;gap:7px;padding:8px 12px 7px;cursor:pointer;
  user-select:none;
}
.pl-head h2{
  margin:0;font-size:11.5px;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-3);white-space:nowrap;
}
.pl-head .count{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-3);
  background:var(--surface-2);border-radius:20px;padding:1px 7px;flex:none;
}
.pl-src{
  font-size:10.5px;color:var(--text-4);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:150px;flex:0 1 auto;
}
.pl-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);
  font:inherit;font-size:11.5px;padding:2px 9px;border-radius:20px;cursor:pointer;
  flex:none;
}
.pl-btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pl-list{display:none;padding:0 12px 9px;flex-direction:column;gap:4px;
         max-height:190px;overflow-y:auto}
.plan.open .pl-list{display:flex}
.pl-item{
  display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:var(--radius-sm);
  background:var(--surface-2);cursor:pointer;transition:background .12s;
  border-left:2.5px solid var(--line-strong);position:relative;
}
.pl-item:hover{background:var(--surface-3)}
.pl-item.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.pl-item.done{border-left-color:var(--com);opacity:.6}
.pl-item.done .pl-topic{text-decoration:line-through;text-decoration-thickness:1px;
                        text-decoration-color:var(--text-4)}
.pl-item.confirm{border-left-color:var(--req)}
.pl-item.report{border-left-color:var(--dec)}
.pl-item.followup{border-left-color:var(--agr)}
.pl-tick{
  flex:none;width:14px;height:14px;margin-top:2px;border-radius:4px;
  border:1.5px solid var(--line-strong);background:var(--surface);position:relative;
}
.pl-item.done .pl-tick{background:var(--com);border-color:var(--com)}
.pl-item.done .pl-tick::after{
  content:"";position:absolute;left:3.5px;top:0.5px;width:4px;height:7px;
  border:solid var(--note-inner);border-width:0 1.5px 1.5px 0;transform:rotate(43deg);
}
.pl-body{min-width:0;flex:1}
.pl-topic{font-size:13px;font-weight:550;line-height:1.45}
.pl-meta{font-size:11px;color:var(--text-3);line-height:1.45;margin-top:1px;
         display:flex;gap:6px;flex-wrap:wrap}
.pl-slot{font-family:var(--mono);font-size:10.5px}
.pl-who{color:var(--accent)}
/* prep 项的来源：可能是拖进来的某句发言，也可能是引用的文件条款 */
.pl-from{
  font-size:10.5px;color:var(--text-3);margin-top:3px;padding-left:7px;
  border-left:2px solid var(--surface-3);line-height:1.5;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.pl-from b{color:var(--text-2);font-weight:600}
.pl-rm{
  opacity:0;border:0;background:none;color:var(--text-3);cursor:pointer;
  font-size:14px;line-height:1;padding:0 3px;border-radius:4px;flex:none;
}
.pl-item:hover .pl-rm{opacity:1}
.pl-rm:hover{background:var(--risk-bg);color:var(--risk)}
.pl-add{display:flex;gap:5px;padding-top:2px}
.pl-add input{
  flex:1;min-width:0;font:inherit;font-size:12.5px;padding:5px 8px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text);
}
.pl-add input:focus{outline:none;border-color:var(--accent-line);background:var(--surface)}
.pl-empty{font-size:11.5px;color:var(--text-4);padding:2px 0 6px;line-height:1.6}

/* 拖拽反馈。发言流里的每一段都可以拖进「我的发言计划」。 */
.utt.dragging{opacity:.45}
.pl-list.droptarget{
  background:var(--accent-soft);outline:2px dashed var(--accent-line);
  outline-offset:-2px;border-radius:var(--radius-sm);
}
.drop-hint{
  position:fixed;pointer-events:none;z-index:70;background:var(--text);color:var(--on-accent);
  font-size:12px;padding:5px 10px;border-radius:6px;
  box-shadow:var(--shadow-ghost);
}

/* 计划项上钉住的参考依据 */
.pl-refs{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.pl-refs-h{
  font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-4);
}
.pl-ref{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-left:2.5px solid var(--clause);border-radius:var(--radius-sm);
  padding:4px 20px 4px 7px;
}
.pl-ref-t{font-size:11.5px;font-weight:600;color:var(--accent);line-height:1.4;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-ref-x{font-size:11px;color:var(--text-3);line-height:1.5;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
          overflow:hidden}
.pl-ref-rm{
  position:absolute;right:2px;top:2px;border:0;background:none;cursor:pointer;
  color:var(--text-4);font-size:13px;line-height:1;padding:1px 4px;border-radius:4px;
}
.pl-ref-rm:hover{background:var(--risk-bg);color:var(--risk)}

/* 拖参考依据时的落点高亮 */
.pl-item.refdrop{
  outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);
}

/* 拖拽来源：右栏的检索卡 */
.res, .ref{cursor:grab}
.res:active, .ref:active{cursor:grabbing}
.res.dragging, .ref.dragging{opacity:.45}

/* ── 发言计划：便签层 ──────────────────────────────────────────────── */
/* 为什么不是折叠面板：面板一次只能看到几条，"看不见全貌"是它最大的问题。
   而发言计划本身就是几个离散要点，便签的形状和它一致——每条要点一张，
   位置由用户自己摆，摆法本身就是在组织发言顺序。 */
/* 入口条（在中栏底部，只是个标题栏 + 计数 + 新建） */
.notes{
  position:relative;flex:none;
  display:flex;align-items:center;gap:7px;padding:6px 12px;
  background:var(--surface);border-top:1px solid var(--line);
}
.notes.hidden{opacity:.5}
/* .notes-head 内部有 .spacer 和按钮，所以它自己也必须是 flex 行；
   而且必须 flex:1——不写的话它按内容宽度收缩成 97px，标题一行、按钮被挤到第二行，
   在界面上就是一坨竖着堆起来的小方块而不是一条横栏。 */
.notes-head{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px}
.notes-title{font-size:11.5px;font-weight:650;letter-spacing:.05em;
             text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.notes .count{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-3);
              background:var(--surface-2);border-radius:20px;padding:1px 7px}

/* 便签所在的整页覆盖层。fixed + 视口坐标；便签本身被 noteArea() 夹在中栏右侧的
   便签道里，所以坐标仍然是视口坐标，但摆不到侧栏上去。 */
.notes-layer{
  position:fixed;inset:0;pointer-events:none;z-index:40;
}
.notes-layer.hidden{display:none}

/* 一张便签 */
.note{
  position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  background:var(--note-bg);border:1px solid var(--note-line);border-radius:11px;
  box-shadow:var(--shadow-2);
  overflow:hidden;transition:box-shadow .14s,border-color .14s;
  /* 整张便签都是抓手，所以整张都要禁止浏览器的原生触摸手势——
     不写这条，触屏/触摸板上按下拖动会被浏览器当成滚动页面，便签纹丝不动。
     鼠标拖拽也有一个副作用要挡：正文是 contentEditable，按住会把文字选中。 */
  touch-action:none;cursor:grab;
  /* 便签再高也不能高过窗口：参考条挂多了会把便签撑到屏幕外，底部那些按钮就再也点不到。
     正文区本来就可以滚动，所以封顶不会丢内容。 */
  max-height:calc(100vh - 96px);
}
.note:active{cursor:grabbing}
/* 控件自己恢复成正常光标与默认触摸行为，否则按钮上也是"抓手"看着很怪 */
.note button,.note-resize,.note-topic{cursor:auto}
.note-topic{cursor:text}
.note-resize{cursor:nwse-resize}
.note:hover{box-shadow:var(--shadow-3)}
.note.active{border-color:var(--accent-line);
             box-shadow:var(--shadow-accent)}
.note.done{background:var(--note-bg-done);border-color:var(--note-line-done)}
.note.done .note-topic{text-decoration:line-through;
                       text-decoration-color:var(--text-4);color:var(--text-3)}
/* 顶条按类型着色：一眼扫出哪张是要求、哪张是承诺 */
.note-band{height:3px;flex:none;background:var(--line-strong)}
.note[data-kind=topic]  .note-band{background:var(--dec)}
.note[data-kind=confirm] .note-band{background:var(--req)}
.note[data-kind=report] .note-band{background:var(--com)}
.note[data-kind=followup] .note-band{background:var(--agr)}
.note[data-kind=risk]   .note-band{background:var(--risk)}
.note-head{
  display:flex;align-items:center;gap:5px;padding:6px 8px 3px;
  cursor:grab;user-select:none;flex:none;
}
.note-head:active{cursor:grabbing}
.note-grip{color:var(--text-4);font-size:11px;letter-spacing:-1px;flex:none}
.note-head .spacer{flex:1}
.note-x{border:0;background:none;cursor:pointer;color:var(--text-4);font-size:14px;
        line-height:1;padding:0 3px;border-radius:4px;flex:none}
.note-x:hover{background:var(--risk-bg);color:var(--risk)}
.note-body{padding:0 10px 9px;overflow-y:auto;flex:1;min-height:0}
.note-topic{
  font-size:13.5px;line-height:1.5;font-weight:550;color:var(--text);
  outline:none;border-radius:4px;padding:1px 2px;margin:0 -2px;cursor:text;
}
.note-topic:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent-line)}
.note-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:11px;
           color:var(--text-3)}
.note-from{
  margin-top:5px;font-size:11px;color:var(--text-3);line-height:1.5;
  padding-left:7px;border-left:2px solid var(--note-quote);cursor:pointer;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
}
.note-from:hover{color:var(--text-2)}
.note-refs{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.note-refs-h{font-size:9.5px;font-weight:650;letter-spacing:.05em;
             text-transform:uppercase;color:var(--text-4)}
.note-ref{
  position:relative;background:var(--note-inner);border:1px solid var(--note-inner-line);border-radius:6px;
  padding:4px 18px 4px 6px;
}
.note-ref-t{font-size:11px;font-weight:600;color:var(--accent);line-height:1.35;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-ref-x{font-size:10.5px;color:var(--text-3);line-height:1.45;
            display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
            overflow:hidden}
.note-ref-rm{position:absolute;right:1px;top:1px;border:0;background:none;
             cursor:pointer;color:var(--text-4);font-size:12px;line-height:1;
             padding:1px 3px;border-radius:3px}
.note-ref-rm:hover{background:var(--risk-bg);color:var(--risk)}
/* 拖参考时的落点高亮 */
.note.refdrop{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 右下角缩放柄 */
.note-resize{
  position:absolute;right:0;bottom:0;width:15px;height:15px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 52%,var(--line-strong) 52%,
             var(--line-strong) 62%,transparent 62%,transparent 72%,
             var(--line-strong) 72%,var(--line-strong) 82%,transparent 82%);
  opacity:0;transition:opacity .13s;
}
.note:hover .note-resize{opacity:.75}
.note-empty{
  /* fixed 层里的居中：left 由 renderNotes 按**中栏**的中心算出并写进 style，
     不能用 left:50%——那是视口中心，在 1680 宽下比中栏中心偏右 78px，会压到右栏上。
     背景也必须走令牌：写死白色在暗色主题下就是一个刺眼的白框。 */
  position:fixed;transform:translateX(-50%);top:120px;
  padding:14px 18px;border-radius:var(--radius);
  background:var(--note-bg);border:1px dashed var(--note-line);
  font-size:12.5px;color:var(--text-3);line-height:1.8;max-width:460px;
  box-shadow:var(--shadow-2);text-align:center;
}

/* 拖拽时的浮动提示（统一指针拖拽用，替代 HTML5 拖影） */
.drag-ghost{
  position:fixed;pointer-events:none;z-index:70;max-width:320px;
  background:var(--text);color:var(--on-accent);font-size:12px;line-height:1.5;
  padding:6px 11px;border-radius:7px;
  box-shadow:var(--shadow-ghost);
}
.drag-ghost small{display:block;opacity:.7;font-size:10.5px;margin-top:1px}
/* 被拖的源元素 */
.utt.dragging{opacity:.4}
.res.dragging,.ref.dragging{opacity:.4}

/* ── 中栏：发言流 ─────────────────────────────────────────────────── */
.feed{padding:6px 0 40px}
.utt{
  display:grid;grid-template-columns:54px minmax(0,1fr);gap:0;
  padding:9px 20px 9px 12px;position:relative;
  border-bottom:1px solid transparent;transition:background .13s;
}
.utt:hover{background:var(--hover-veil)}
.utt.sel{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.utt.open .u-text{opacity:.72}
.u-time{
  font-family:var(--mono);font-size:11px;color:var(--text-3);
  padding-top:3px;font-variant-numeric:tabular-nums;user-select:none;
  display:flex;flex-direction:column;gap:2px;
}
/* 拖拽柄只占时间列里的一小格，不整行 draggable。
   整行 draggable 会让这段文字**无法选中复制**——而"能抄下原话"是会议记录的硬需求，
   不能用它换一次拖拽便利。 */
.u-grip{
  font-size:11px;line-height:1;color:var(--text-4);cursor:grab;
  opacity:0;transition:opacity .12s;user-select:none;letter-spacing:-1px;
  padding:1px 0;
}
.utt:hover .u-grip{opacity:1}
.u-grip:active{cursor:grabbing}
.u-body{min-width:0}
.u-who{
  font-size:11.5px;font-weight:600;margin-bottom:2px;
  display:inline-flex;align-items:center;gap:5px;
}
.u-text{
  font-size:15.5px;line-height:1.85;color:var(--text);
  word-break:break-word;transition:opacity .3s;
}
.u-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
/* 不同类型用不同颜色：一条 3px 的左条把"这段里有甲方要求/有承诺/有节点"标出来，
   不需要读文字。用户的原话是"不一定要分类标签，同类的就同一种颜色就行了"。 */
.utt::before{
  content:"";position:absolute;left:4px;top:10px;bottom:10px;width:2.5px;
  border-radius:2px;background:transparent;transition:background .2s;
}
.utt[data-tone=req]::before{background:var(--req)}
.utt[data-tone=com]::before{background:var(--com)}
.utt[data-tone=date]::before{background:var(--date)}
.utt[data-tone=risk]::before{background:var(--risk)}
.utt[data-tone=agr]::before{background:var(--agr)}
.utt[data-tone=clause]::before{background:var(--clause)}
.utt[data-tone=dec]::before{background:var(--dec)}
.utt[data-tone=term]::before{background:var(--term)}
.utt[data-tone=who]::before{background:var(--who)}
.utt[data-tone=org]::before{background:var(--org)}
/* 声纹绑好名字之后，左侧这道色条改成**说话人的颜色**——同一个人说话就是同一个颜色，
   一眼能看出"这几句都是谁"。用户要的就是这个："用相同颜色表示同一个人的发言"。
   写在 tone 规则**后面**并且多一个 [data-tone] 提一格特异性，否则会被上面那些盖住。 */
.utt.has-spk[data-tone]::before{background:var(--utt-bar,var(--term))}
/* 声纹提示：同一段声音还有几句没署名。点一下会一起改，所以要先说清楚。 */
.u-spk{
  font-size:10.5px;color:var(--text-3);background:var(--surface-2);
  border:1px solid var(--line);border-radius:20px;padding:0 6px;margin-left:5px;
  white-space:nowrap;
}
/* 跨会声纹库的建议："听起来像 林浩然 0.82"。**只建议，不改名**——
   认错人在会议里代价很高（把甲方的话记到我方名下，比"未署名"糟得多）。 */
.u-sug{
  display:inline-flex;align-items:center;gap:5px;margin-left:6px;
  font-size:10.5px;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:20px;padding:0 6px;white-space:nowrap;
}
.u-sug button{
  font:inherit;font-size:10.5px;cursor:pointer;border:0;background:none;
  color:var(--accent);padding:0 2px;border-radius:3px;
}
.u-sug button:hover{background:var(--accent);color:var(--on-accent)}
.u-sug .no{color:var(--text-3)}
.u-sug .no:hover{background:var(--surface-3);color:var(--text)}
.u-who{cursor:pointer}
.u-who:hover{text-decoration:underline}
.badge{
  font-size:10.5px;line-height:16px;padding:0 6px;border-radius:4px;
  border:1px solid;font-weight:500;cursor:pointer;transition:filter .12s;
}
.badge:hover{filter:brightness(.96)}
.badge.req{color:var(--req);border-color:var(--req-line);background:var(--req-bg)}
.badge.com{color:var(--com);border-color:var(--com-line);background:var(--com-bg)}
.badge.date{color:var(--date);border-color:var(--date-line);background:var(--date-bg)}
.badge.risk{color:var(--risk);border-color:var(--risk-line);background:var(--risk-bg)}
.badge.agr{color:var(--agr);border-color:var(--agr-line);background:var(--agr-bg)}
.badge.clause{color:var(--clause);border-color:var(--clause-line);background:var(--clause-bg)}
.badge.dec{color:var(--dec);border-color:var(--dec-line);background:var(--dec-bg)}
.badge.term{color:var(--term);border-color:var(--term-line);background:var(--term-bg)}
.badge.who{color:var(--who);border-color:var(--who-line);background:var(--who-bg)}
.badge.org{color:var(--org);border-color:var(--org-line);background:var(--org-bg)}

/* 关键词热区：下划线而非底色块。底色块在整段文字里会碎片化阅读节奏，
   下划线能标出词又不打断句子。 */
.kw{
  border-bottom:1.5px solid var(--date-line);cursor:help;
  transition:background .12s,border-color .12s;border-radius:2px 2px 0 0;
  padding-bottom:.5px;
}
.kw:hover{background:var(--date-bg);border-bottom-color:var(--date)}
.kw.on{background:var(--accent-soft);border-bottom-color:var(--accent)}

/* 修订中：右侧一个极细的进度条，表示这句还可能变 */
.utt .rev{
  position:absolute;right:20px;top:14px;width:3px;height:12px;border-radius:2px;
  background:var(--accent);opacity:0;transition:opacity .3s;
}
.utt.open .rev{opacity:.35;animation:pulse 1.6s ease-in-out infinite}

/* ── 右栏：线索 ───────────────────────────────────────────────────── */
.filters{display:flex;gap:4px;flex-wrap:wrap;padding:8px 10px;
         border-bottom:1px solid var(--line);flex:none}
.fchip{
  font-size:11.5px;padding:2px 8px;border-radius:20px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);
  transition:all .12s;user-select:none;
}
.fchip:hover{border-color:var(--line-strong)}
.fchip.on{background:var(--text);border-color:var(--text);color:var(--on-accent)}
.fchip .n{opacity:.6;font-variant-numeric:tabular-nums;margin-left:3px}
/* 颜色点：同色即同类，不需要读文字 */
.fdot{
  width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;
  background:var(--line-strong);
}
.fdot[data-tone=all]{background:conic-gradient(var(--req),var(--date),var(--com),var(--dec),var(--req))}
.fdot[data-tone=req]{background:var(--req)}
.fdot[data-tone=com]{background:var(--com)}
.fdot[data-tone=date]{background:var(--date)}
.fdot[data-tone=risk]{background:var(--risk)}
.fdot[data-tone=agr]{background:var(--agr)}
.fdot[data-tone=clause]{background:var(--clause)}
.fdot[data-tone=dec]{background:var(--dec)}
.fdot[data-tone=term]{background:var(--term)}
.fdot[data-tone=who]{background:var(--who)}
.fdot[data-tone=org]{background:var(--org)}
.fchip{display:inline-flex;align-items:center;gap:5px}
.fchip.on .fdot{box-shadow:0 0 0 2px var(--bg)}

.clue{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  padding:10px 11px 10px 12px;margin-bottom:8px;cursor:pointer;
  transition:border-color .13s,box-shadow .13s,transform .13s;position:relative;
  border-left:3px solid var(--line-strong);
}
.clue:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.clue.sel{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.clue.pinned{background:var(--note-bg)}
.clue[data-tone=req]{border-left-color:var(--req)}
.clue[data-tone=com]{border-left-color:var(--com)}
.clue[data-tone=date]{border-left-color:var(--date)}
.clue[data-tone=risk]{border-left-color:var(--risk)}
.clue[data-tone=agr]{border-left-color:var(--agr)}
.clue[data-tone=clause]{border-left-color:var(--clause)}
.clue[data-tone=dec]{border-left-color:var(--dec)}
.clue[data-tone=term]{border-left-color:var(--term)}
.clue[data-tone=who]{border-left-color:var(--who)}
.clue[data-tone=org]{border-left-color:var(--org)}
.c-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.c-kind{
  font-size:10.5px;font-weight:650;letter-spacing:.02em;padding:1px 6px;
  border-radius:4px;border:1px solid;
}
.c-time{font-family:var(--mono);font-size:10.5px;color:var(--text-3);
        font-variant-numeric:tabular-nums}
.c-conf{margin-left:auto;font-size:10px;color:var(--text-3);display:flex;
        align-items:center;gap:4px}
.c-bar{width:26px;height:3px;border-radius:2px;background:var(--surface-3);
       overflow:hidden}
.c-bar i{display:block;height:100%;background:var(--text-3)}
.c-text{font-size:13.5px;line-height:1.6;color:var(--text);word-break:break-word}
.c-src{
  margin-top:6px;font-size:11.5px;color:var(--text-3);line-height:1.5;
  padding-left:8px;border-left:2px solid var(--surface-3);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.c-src mark{background:var(--date-bg);color:inherit;border-radius:2px}
.c-acts{display:flex;gap:6px;margin-top:7px;opacity:0;transition:opacity .13s}
.clue:hover .c-acts,.clue.sel .c-acts{opacity:1}
.c-act{
  font-size:11px;padding:1px 7px;border-radius:5px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);
}
.c-act:hover{border-color:var(--line-strong);background:var(--surface-2)}
.c-act.danger:hover{color:var(--risk);border-color:var(--risk-line);background:var(--risk-bg)}

/* ── 详情面板（点击线索/关键词后出现）────────────────────────────── */
.detail{
  border-top:1px solid var(--line);background:var(--surface-2);
  flex:none;max-height:52%;overflow-y:auto;
  animation:slideUp .2s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.d-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--surface-2);z-index:2;
}
.d-head h3{margin:0;font-size:12.5px;font-weight:650}
.d-close{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--text-3);
         font-size:17px;line-height:1;padding:2px 6px;border-radius:5px}
.d-close:hover{background:var(--surface-3);color:var(--text)}
.d-body{padding:10px 12px 14px}
.d-sec{margin-bottom:12px}
.d-sec:last-child{margin-bottom:0}
.d-label{
  font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:5px;
}
.d-quote{
  font-size:13.5px;line-height:1.75;padding:9px 11px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--line);
}
.d-quote mark{background:var(--date-bg);border-bottom:1.5px solid var(--date);
              border-radius:2px;padding:0 1px}
.ref{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:9px 11px;margin-bottom:6px;
}
.ref:last-child{margin-bottom:0}
.ref-h{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.ref-t{font-size:12.5px;font-weight:600;color:var(--accent)}
.ref-l{font-size:10.5px;color:var(--text-3);border:1px solid var(--line);
       border-radius:4px;padding:0 5px}
.ref-s{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ref-pin{
  margin-left:auto;font:inherit;font-size:11px;padding:1px 8px;border-radius:20px;
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);
  cursor:pointer;flex:none;
}
.ref-pin:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ref-x{font-size:12.5px;line-height:1.65;color:var(--text-2)}
.ref-x mark{background:var(--date-bg);border-radius:2px}

.empty{
  text-align:center;color:var(--text-3);font-size:13px;padding:34px 20px;line-height:1.8;
}
.empty b{display:block;color:var(--text-2);font-size:13.5px;font-weight:600;
         margin-bottom:4px}
.hint{font-size:11.5px;color:var(--text-3);padding:6px 12px;line-height:1.6}

/* ── 悬浮卡（关键词 hover 摘要）───────────────────────────────────── */
/* ── Markdown 渲染（佐证面板 / 悬浮框）─────────────────────────────────
   语料库里全是 Markdown 文档，原来直接贴源码，屏幕上满是 `###`、``` 围栏、
   `| a | b |` 表格行——用户说"显示的都还是编辑状态的形式，阅读体验非常糟糕"。
   这些规则把 mdRender() 产出的结构排成可读的样子。 */
.md-p{margin:3px 0;line-height:1.65}
.md-h{font-weight:650;color:var(--text);margin:6px 0 2px}
.md-h1,.md-h2{font-size:13px}
.md-h3,.md-h4,.md-h5,.md-h6{font-size:12px;color:var(--text-2)}
.md-pre{font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:6px 8px;margin:4px 0;overflow-x:auto;white-space:pre}
.md-code{font-family:var(--mono);font-size:11px;background:var(--surface-2);
  border-radius:3px;padding:0 3px}
.md-tbl{border-collapse:collapse;margin:4px 0;font-size:11.5px}
.md-tbl th,.md-tbl td{border:1px solid var(--line);padding:2px 6px;text-align:left;
  color:var(--text-2);vertical-align:top}
.md-tbl th{color:var(--text-3);font-weight:600;background:var(--surface-2)}
.md-ul{margin:3px 0 3px 16px;padding:0}
.md-ul li{margin:1px 0}
.md-q{border-left:2px solid var(--line-strong);padding-left:7px;color:var(--text-3);margin:4px 0}
.md-hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.md-wl{color:var(--accent)}

#pop{
  position:fixed;z-index:60;width:340px;display:none;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--radius);box-shadow:var(--shadow-pop);
  padding:10px 12px;font-size:12.5px;line-height:1.6;
  animation:popIn .13s cubic-bezier(.4,0,.2,1);
}
@keyframes popIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
#pop .ph{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
#pop .pt{font-weight:650;font-size:12.5px;color:var(--text)}
#pop .pm{margin-left:auto;font-size:10.5px;color:var(--text-3);
         font-family:var(--mono)}
#pop .prow{padding:7px 0;border-top:1px solid var(--line)}
#pop .prow:first-of-type{border-top:0;padding-top:0}
#pop .prt{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
#pop .prx{font-size:12px;color:var(--text-2);line-height:1.6;
          display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
          overflow:hidden}
#pop .prx mark{background:var(--date-bg);border-radius:2px}
#pop .psrc{font-size:12px;font-weight:600;color:var(--text)}
#pop .plab{font-size:10.5px;font-weight:500;color:var(--text-3);margin-left:5px;
  border:1px solid var(--line);border-radius:3px;padding:0 4px}
#pop .pcrumb{font-size:11px;color:var(--text-3);margin:1px 0 4px}
/* 逐字原文：左边一道竖线，读起来是"引用"而不是"搜索结果" */
#pop .pq{font-size:12px;color:var(--text-2);line-height:1.6;white-space:pre-wrap;
  border-left:2px solid var(--line-strong);padding:1px 0 1px 7px;margin:4px 0}
#pop .pfoot{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);
            font-size:10.5px;color:var(--text-3);text-align:right}

/* ── 搜索 ─────────────────────────────────────────────────────────── */
#search{
  position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:80;
  display:none;align-items:flex-start;justify-content:center;padding-top:12vh;
  backdrop-filter:blur(2px);
}
#search.on{display:flex}
.s-box{
  width:min(660px,92vw);background:var(--surface);border-radius:14px;
  box-shadow:0 24px 64px -12px rgba(17,24,39,.4);overflow:hidden;
  animation:popIn .16s cubic-bezier(.4,0,.2,1);
}
.s-in{
  width:100%;border:0;border-bottom:1px solid var(--line);font:inherit;
  font-size:15px;padding:15px 18px;background:none;color:var(--text);
}
.s-in:focus{outline:none}
.s-res{max-height:52vh;overflow-y:auto;padding:6px}
.s-row{padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer}
.s-row:hover,.s-row.on{background:var(--accent-soft)}
.s-rt{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.s-rx{font-size:13px;color:var(--text-2);line-height:1.6;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden}
.s-rx mark{background:var(--date-bg);border-radius:2px}
.s-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;
        color:var(--text-3);display:flex;gap:12px}

/* ── 设置 / 导入 / 发言计划 ───────────────────────────────────────── */
/* 覆盖层而不是嵌入某一栏：ASR、检索、大模型是三件互不相干的事，塞进任何一栏
   都会读成"它属于那一栏"。左轨分节，右侧只画当前一节——五节平铺会变成一堵墙。

   三个面板共用这一条规则。发言计划编辑器第一次写的时候**漏掉了自己的选择器**，
   于是它没有任何覆盖层样式：没有 position:fixed、没有 display:none，就变成一个
   普通 div 待在文档流里，永远显示、把 main 挤成一条。界面"乱"的根因就是这个——
   一个面板漏了一条选择器，整个页面跟着塌。所以四个 id（设置 / 导入 / 使用引导）
   写在同一个地方，加第五个面板时只要照着这一行抄就不会漏。 */
#settings,#imp,#guide{
  position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:85;
  display:none;align-items:center;justify-content:center;padding:4vh 4vw;
  backdrop-filter:blur(2px);
}
#settings.on,#imp.on,#guide.on{display:flex}
/* 引导这一层**不压暗页面**：它要指的就是页面本身，压暗 + 模糊之后那圈强调环也跟着
   灰掉、糊掉，"看这里"就没了。只留一层透明的全屏层——它的用处是接住"点外面 = 关掉"，
   顺便挡住误点。卡片自己带边框和阴影，浮在真界面之上反而更像"指给你看"。 */
#guide{background:none;backdrop-filter:none;padding:0}
.st-box{
  width:min(880px,94vw);height:min(640px,88vh);background:var(--surface);
  border-radius:14px;box-shadow:var(--shadow-3);display:flex;overflow:hidden;
  animation:popIn .16s cubic-bezier(.4,0,.2,1);
}
.imp-box{width:min(560px,92vw);height:auto;max-height:86vh;flex-direction:column}
.st-rail{
  width:172px;flex:0 0 auto;background:var(--surface-2);border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:1px;
}
.st-rail h3{
  margin:0;padding:0 8px 10px;font-size:11.5px;font-weight:600;
  color:var(--text-3);letter-spacing:.06em;
}
.st-tab{
  font:inherit;font-size:13px;text-align:left;cursor:pointer;width:100%;
  border:0;background:none;color:var(--text-2);padding:8px 10px;
  border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;
}
.st-tab:hover{background:var(--hover-veil);color:var(--text)}
.st-tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.st-dot{width:7px;height:7px;border-radius:50%;background:var(--text-4);flex:0 0 auto}
.st-dot.ok{background:var(--ok-ink)}
.st-dot.bad{background:var(--risk)}
.st-pane{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.st-head{
  display:flex;align-items:center;gap:10px;padding:15px 20px 12px;
  border-bottom:1px solid var(--line);
}
.st-head h2{margin:0;font-size:15px;font-weight:600}
.st-sub{font-size:12px;color:var(--text-3)}
.st-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 20px 20px}
.st-row{
  padding:13px 0;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:186px minmax(0,1fr);gap:4px 16px;align-items:start;
}
.st-row:last-child{border-bottom:0}
.st-lab{font-size:13px;font-weight:500;padding-top:7px;color:var(--text)}
.st-hint{grid-column:2;font-size:11.5px;line-height:1.65;color:var(--text-3);margin-top:3px}
.st-in{
  width:100%;font:inherit;font-size:13px;padding:7px 10px;
  border-radius:var(--radius-sm);border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--text);
}
.st-in:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--shadow-accent)}
.st-in.dirty{border-color:var(--accent-line);background:var(--accent-soft)}
select.st-in{cursor:pointer}
.st-chk{display:flex;align-items:center;gap:8px;padding-top:8px;font-size:13px;color:var(--text-2)}
.st-chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.st-tag{
  font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text-3);
}
.st-tag.ok{color:var(--ok-ink);border-color:var(--ok-soft);background:var(--ok-soft)}
.st-tag.bad{color:var(--risk);border-color:var(--risk-line);background:var(--risk-bg)}
.st-note{
  margin:6px 0 12px;padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface-2);
  font-size:12px;line-height:1.75;color:var(--text-2);
}
.st-note b{color:var(--text)}
.st-note.warn{border-color:var(--date-line);background:var(--date-bg);color:var(--date)}
.st-note.warn b{color:var(--date)}
.st-kv{font-family:var(--mono);font-size:11.5px;line-height:1.9;color:var(--text-2);word-break:break-all}
.st-kv i{font-style:normal;display:inline-block;min-width:110px;color:var(--text-3);
         font-family:var(--sans);font-size:12px}
.st-opt{
  display:flex;gap:10px;align-items:flex-start;padding:9px 11px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:6px;
  transition:border-color .13s,background .13s;
}
.st-opt:hover{background:var(--surface-2)}
.st-opt.on{border-color:var(--accent-line);background:var(--accent-soft)}
.st-opt input{margin-top:3px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
.st-opt-t{font-size:13px;font-weight:500;color:var(--text)}
.st-opt-h{font-size:11.5px;line-height:1.6;color:var(--text-3);margin-top:2px}
.st-foot{
  flex:0 0 auto;padding:12px 20px;border-top:1px solid var(--line);
  background:var(--surface-2);display:flex;align-items:center;gap:10px;
}
.st-msg{flex:1 1 auto;min-width:0;font-size:12px;color:var(--text-3)}
.st-msg.ok{color:var(--ok-ink)}
.st-msg.bad{color:var(--risk)}

/* ── 使用引导（首次打开自动出现一次）──────────────────────────────── */
/* 只讲"这块是干什么的、我该点哪里"。每一步给目标控件加一圈强调环（.g-hl），
   而不是挖一个高亮洞：洞要跟着布局重算坐标，窗口一缩、栏一折叠，洞就跑到别的地方
   去了；环不参与布局，加在哪都只是画一圈线。这一层也不压暗页面（见上面的
   #guide 覆盖），否则页面连同环一起变灰，"看这里"就没了。 */
.g-box{
  width:min(660px,94vw);height:auto;max-height:88vh;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-3);
  display:flex;flex-direction:column;overflow:hidden;
  animation:popIn .16s cubic-bezier(.4,0,.2,1);
}
.g-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:15px 20px 12px;border-bottom:1px solid var(--line);
}
.g-head h2{margin:0;font-size:15px;font-weight:600}
.g-count{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.g-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 20px 18px;
  display:flex;flex-direction:column;gap:9px;
}
.g-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text)}
.g-num{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;font-size:11.5px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.g-text{font-size:13px;line-height:1.8;color:var(--text-2)}
.g-text b{color:var(--text)}
.g-where{
  font-size:12px;line-height:1.7;color:var(--text-3);
  border-left:2px solid var(--line-strong);padding-left:9px;margin-top:2px;
}
.g-keys{font-size:11.5px;line-height:2.1;color:var(--text-3)}
.g-keys b{color:var(--text-2);font-weight:500;display:inline-block;min-width:82px}
.g-foot{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 20px;
  border-top:1px solid var(--line);background:var(--surface-2);
}
.g-foot .g-once{font-size:11.5px;color:var(--text-3)}
/* 强调环。用 outline 而不是 box-shadow：outline 不参与布局、不改变元素尺寸，
   所以给顶栏按钮或整栏加环都不会把界面挤动一像素。 */
.g-hl{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px;
      animation:gRing 1.8s ease-in-out infinite}
@keyframes gRing{0%,100%{outline-color:var(--accent)}50%{outline-color:var(--accent-soft)}}

/* 便签里的标签点：五色小圆点，点一下就换类别。
   没有弹窗、没有循环点击——用户说过"同类的就同一种颜色就行了"，
   所以便签上只给颜色，名称放在 title 里。 */
.note-dots{display:flex;align-items:center;gap:5px;flex:none;margin-left:2px}
.note-dot{
  width:11px;height:11px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--text-4);flex:none;transition:transform .1s;
}
.note-dot:hover{transform:scale(1.25)}
.note-dot.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
/* 顶部入口条里的"写一条要点"输入框 */
.notes-input{
  font:inherit;font-size:12.5px;flex:1 1 auto;min-width:120px;max-width:340px;
  padding:5px 9px;border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);
}
.notes-input:focus{outline:none;border-color:var(--accent-line);
                   box-shadow:0 0 0 3px var(--accent-soft)}
.notes-input::placeholder{color:var(--text-3)}

/* ── 提示条 ───────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--on-accent);font-size:13px;padding:9px 16px;
  border-radius:8px;opacity:0;transition:opacity .2s,transform .2s;z-index:90;
  pointer-events:none;box-shadow:0 8px 24px -6px rgba(0,0,0,.35);
}
#toast.on{opacity:1;transform:translateX(-50%)}

/* 窄屏策略：不做覆盖层。覆盖层要处理点外部关闭、Esc、焦点陷阱、滚动锁定，
   而这块界面的真实场景是一台 14–16 寸笔记本全屏——三栏在 1100px 上仍放得下
   （224 + 546 + 330）。只在更窄时收起侧栏，由用户显式打开。

   两套类名（宽屏用 hide-*、窄屏用 show-*）看着重复，但它们是不同的默认值：
   宽屏默认都显示，窄屏默认都隐藏。用一套表达不了，硬凑会让 CSS 变成猜谜。
   每一档都显式写出"可见性"，因为只改列宽会留下一条 0 宽但有内容的缝——
   审计在 1100px 上抓到过：栏宽 1px，内容撑出 82px 溢出。 */
@media (max-width:1500px){
  main{grid-template-columns:236px minmax(0,1fr) 360px}
  main.hide-left{grid-template-columns:0 minmax(0,1fr) 360px}
  main.hide-right{grid-template-columns:236px minmax(0,1fr) 0}
  main.hide-left.hide-right{grid-template-columns:0 minmax(0,1fr) 0}
}
@media (max-width:1240px){
  main{grid-template-columns:224px minmax(0,1fr) 330px}
  main.hide-left{grid-template-columns:0 minmax(0,1fr) 330px}
  main.hide-right{grid-template-columns:224px minmax(0,1fr) 0}
  main.hide-left.hide-right{grid-template-columns:0 minmax(0,1fr) 0}
}
@media (max-width:1060px){
  /* 默认只留中栏。这一行不能省——上一档是 224px/1fr/330px，不覆盖的话
     折叠掉侧栏后中栏仍然只有 1fr 的份额，而侧栏的两条轨道还占着宽度。 */
  main{grid-template-columns:0 minmax(0,1fr) 0}
  main #col-left,main #col-right{display:none}
  main.show-left{grid-template-columns:240px minmax(0,1fr) 0}
  main.show-left #col-left{display:flex}
  main.show-right{grid-template-columns:0 minmax(0,1fr) 330px}
  main.show-right #col-right{display:flex}
  main.show-left.show-right{grid-template-columns:220px minmax(0,1fr) 300px}
  main.show-left.show-right #col-left,main.show-left.show-right #col-right{display:flex}
}
</style>

<main id="main">
  <!-- ── 左：参会人员 ─────────────────────────────────────────────── -->

<div class="col-body tight" id="people"></div>

    <div style="padding:0 10px 12px">
      <div class="add-row">
        <input id="new-person" placeholder="加人…" spellcheck="false">
        <button class="btn ghost" id="add-person" style="padding:6px 9px">＋</button>
      </div>
    </div>
  </aside>

  <!-- ── 中：发言流 ───────────────────────────────────────────────── -->
  <section class="col mid" id="col-mid">
    <!-- 两块方向相反的清单，刻意分开：
         会议流程由主持人定，从外部来（可导入 docx），决定"我该听什么"；
         发言计划是用户自己的，会中不断积累，决定"我该讲什么"。

    <div class="planbar">

          <button class="pl-btn" id="pa-toggle">展开</button>
        </div>
        <div class="pl-list" id="pa-list"><div class="pl-empty">还没有会议流程。点「导入」读主持人给的 docx / md / txt，或直接手写。</div><div class="pl-add"><input placeholder="加一项流程…" spellcheck="false"></div></div>
      </div>
    </div>

    <div class="col-head">
      <h2>发言流</h2>
      <span class="count" id="mcount">3</span>
      <div class="spacer"></div>
      <button class="pl-btn" id="btn-notes" title="显示/隐藏发言计划便签（Alt+P）">便签 ✓</button>
      <span class="hint" style="padding:0">
        悬停关键词看摘要 · 点击看佐证</span>
    </div>
    
<div class="col-body feed" id="feed" style=""></div>


    <!-- 便签入口条。便签本体不在这里——它们在 <main> 之外的 #notes-layer 里。
         写要点就是在这里打一行字、点「＋ 新便签」——**不再开弹窗**。
         用户的原话："我的发言计划其实最好不好搞弹出框，容易造成麻烦。其实最好是自己做个
         输入框，输入文字后自己点击新便签生成。" 弹窗要多一次开关、要点外面才能看见

    <div id="notes" class="notes">

    <!-- 默认隐藏：以前这里是 style=""，于是空面板一直挂在右栏底部，而且 Esc 的判据

    <div class="detail" id="detail" style="display:none">

<!-- 便签层：覆盖整个界面的一层。它是 <main> 的兄弟而不是子元素，坐标就是视口坐标，

     这一层本身 pointer-events:none，只有便签自己接收指针事件，否则它会挡住整个界面。 -->

<div id="notes-layer" class="notes-layer"></div>

  <div class="s-box">

<!-- 设置：三件互不相干的事（转写 / 检索 / 大模型）合成一页，左轨分节。

     用户最需要知道的是"它能不能用"，而不是"它的路径是什么"。 -->
<div id="settings">
  <div class="st-box">

             的服务不显示这个按钮——没人会把进程拉回来。 -->
        <button class="btn" id="st-restart" hidden
                title="重启后端服务，让识别引擎 / 知识库重新加载">重启服务</button>

<!-- 导入。用自建面板而不是 prompt()：归属（项目库 / 公共库）必须让用户看见，

     就是上一版那个冲突的成因。 -->
<div id="imp">
  <div class="st-box imp-box">
    <section class="st-pane">
      <div class="st-head">
        <h2 id="imp-title">导入会议流程</h2>
        <span class="st-sub">docx / md / txt</span>
      </div>
      <div class="st-body">
        <div class="st-row" style="grid-template-columns:1fr">
          <div class="st-lab" style="padding:0 0 6px">文件路径</div>
          <input class="st-in" id="imp-path" spellcheck="false">
